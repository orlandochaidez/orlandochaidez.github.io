<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Flappy — Clean Arcade</title>
<meta name="description" content="A clean Flappy Bird-style game. Tap, click, or press Space to flap through the pipes.">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0f1115;color:#f5f5f5;display:flex;justify-content:center}
  .wrap{width:min(520px,100%);padding:18px 16px 24px}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  h1{font-size:28px;margin:0}
  a.back{color:#9ecbff;text-decoration:none;font-weight:700;font-size:14px}
  .score{display:flex;justify-content:center;gap:28px;font-weight:900;font-size:24px;margin:8px 0}
  .score small{display:block;font-size:11px;letter-spacing:1px;color:#aaa;text-align:center}
  .stage{position:relative}
  canvas{width:100%;aspect-ratio:2/3;max-height:72dvh;background:linear-gradient(#4ec0ca 0%,#71c5cf 55%,#ded895 55.2%,#ded895 100%);border:2px solid #2a6b74;border-radius:14px;display:block;touch-action:none;margin:0 auto}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  button{flex:1;min-width:120px;border:0;border-radius:10px;padding:13px;font-weight:800;font-size:16px;cursor:pointer;background:#ffcc00;color:#221a00}
  button.secondary{background:#232733;color:#fff;border:1px solid #3a4050}
  .hint{color:#9aa3b2;font-size:13px;line-height:1.5;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>🐤 Flappy</h1><a class="back" href="../index.html">← All games</a></header>
  <div class="score"><div><small>SCORE</small><span id="score">0</span></div><div><small>BEST</small><span id="best">0</span></div></div>
  <div class="stage"><canvas id="game" width="420" height="630"></canvas></div>
  <div class="bar">
    <button id="startBtn">Start / Restart</button>
    <button class="secondary" id="flapBtn">Flap ↑</button>
  </div>
  <p class="hint">Click, tap, press <b>Space</b> / ↑, or hit Flap. One point per pipe. Don’t hit the pipes or the ground.</p>
</div>
<script>
(() => {
  const cv=document.getElementById('game'), ctx=cv.getContext('2d');
  const W=cv.width, H=cv.height, GROUND=78, PLAY_H=H-GROUND;
  let bird, pipes, score, best=+localStorage.getItem('flappy-best')||0;
  let running=false, started=false, frame=0, raf=null, last=0;
  document.getElementById('best').textContent=best;

  function reset(){
    bird={x:92, y:PLAY_H/2, r:17, vy:0, rot:0};
    pipes=[]; score=0; frame=0; started=false;
    document.getElementById('score').textContent='0';
    spawnPipe(W+80);
  }
  function spawnPipe(x){
    const gap=158, margin=64;
    const top=margin+Math.random()*(PLAY_H-gap-margin*2);
    pipes.push({x, top, gap, passed:false});
  }
  function flap(){
    if(!running){ start(); return; }
    started=true;
    bird.vy=-8.6;
  }
  function drawBird(){
    ctx.save(); ctx.translate(bird.x,bird.y); ctx.rotate(bird.rot);
    // body
    ctx.fillStyle='#fbd000'; ctx.beginPath(); ctx.arc(0,0,bird.r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#c79400'; ctx.lineWidth=2; ctx.stroke();
    // wing (flaps with velocity)
    ctx.fillStyle='#f39c12';
    ctx.beginPath(); ctx.ellipse(-6,4,10,6+Math.sin(frame*.5)*2, -0.4, 0, Math.PI*2); ctx.fill();
    // belly
    ctx.fillStyle='#fff3b0'; ctx.beginPath(); ctx.ellipse(4,7,9,6,0,0,Math.PI*2); ctx.fill();
    // eye
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(7,-6,6.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(9,-6,3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(10,-7.5,1.2,0,Math.PI*2); ctx.fill();
    // beak
    ctx.fillStyle='#ff6b35'; ctx.beginPath(); ctx.moveTo(14,-2); ctx.lineTo(26,1); ctx.lineTo(14,5); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function drawPipe(p){
    const w=72;
    const grad=ctx.createLinearGradient(p.x,0,p.x+w,0);
    grad.addColorStop(0,'#4e9b1f'); grad.addColorStop(.18,'#73bf2e'); grad.addColorStop(.55,'#8be04e'); grad.addColorStop(1,'#3e7d18');
    ctx.fillStyle=grad; ctx.strokeStyle='#2a5a12'; ctx.lineWidth=2;
    // top pipe + cap
    ctx.fillRect(p.x,0,w,p.top); ctx.strokeRect(p.x,0,w,p.top);
    ctx.fillRect(p.x-4,p.top-26,w+8,26); ctx.strokeRect(p.x-4,p.top-26,w+8,26);
    // bottom pipe + cap
    const by=p.top+p.gap;
    ctx.fillRect(p.x,by,w,PLAY_H-by); ctx.strokeRect(p.x,by,w,PLAY_H-by);
    ctx.fillRect(p.x-4,by,w+8,26); ctx.strokeRect(p.x-4,by,w+8,26);
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    // sky + soft clouds (parallax drift)
    ctx.fillStyle='rgba(255,255,255,.85)';
    for(let i=0;i<5;i++){
      const cx=((i*130 - (frame*0.35 % (W+140)) + W+140) % (W+140))-70, cy=52+(i%3)*54;
      ctx.beginPath(); ctx.ellipse(cx,cy,30,13,0,0,Math.PI*2); ctx.ellipse(cx+20,cy+3,22,10,0,0,Math.PI*2); ctx.fill();
    }
    // far hills
    ctx.fillStyle='#8fd16a'; ctx.beginPath(); ctx.ellipse(70,PLAY_H,150,42,0,Math.PI,0); ctx.ellipse(300,PLAY_H,190,56,0,Math.PI,0); ctx.ellipse(430,PLAY_H,130,36,0,Math.PI,0); ctx.fill();
    pipes.forEach(drawPipe);
    // ground
    ctx.fillStyle='#ded895'; ctx.fillRect(0,PLAY_H,W,GROUND);
    ctx.fillStyle='#74bf2e'; ctx.fillRect(0,PLAY_H,W,16);
    ctx.fillStyle='rgba(0,0,0,.12)';
    for(let x=-((frame*2.6)%28); x<W; x+=28){ ctx.beginPath(); ctx.moveTo(x,PLAY_H+34); ctx.lineTo(x+14,PLAY_H+GROUND); ctx.lineTo(x+28,PLAY_H+GROUND); ctx.lineTo(x+14,PLAY_H+34); ctx.fill(); }
    drawBird();
    if(!started && running){
      ctx.fillStyle='rgba(0,0,0,.42)'; ctx.fillRect(0,0,W,PLAY_H);
      ctx.fillStyle='#fff'; ctx.textAlign='center';
      ctx.font='900 30px system-ui'; ctx.fillText('FLAPPY', W/2, PLAY_H/2-28);
      ctx.font='700 17px system-ui'; ctx.fillText('Tap / Click / Space to flap', W/2, PLAY_H/2+6);
    }
    if(!running){
      ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(0,0,W,PLAY_H);
      ctx.fillStyle='#fff'; ctx.textAlign='center';
      ctx.font='900 30px system-ui'; ctx.fillText(score>0||frame>0?'Game over 💀':'FLAPPY', W/2, PLAY_H/2-30);
      ctx.font='700 17px system-ui';
      ctx.fillText('Score: '+score+'   Best: '+best, W/2, PLAY_H/2+4);
      ctx.fillText('Press Start / Restart', W/2, PLAY_H/2+30);
    }
  }
  function die(){
    running=false;
    if(score>best){ best=score; localStorage.setItem('flappy-best',best); document.getElementById('best').textContent=best; }
    draw();
  }
  function step(ts){
    if(!running) return;
    const dt=Math.min(2.2,(ts-last)/16.7||1); last=ts; frame+=dt;
    if(started){
      bird.vy+=0.42*dt; if(bird.vy>11) bird.vy=11;
      bird.y+=bird.vy*dt;
      bird.rot=Math.max(-0.45,Math.min(1.25, bird.vy*0.09));
      // pipes
      for(const p of pipes){
        p.x-=2.6*dt;
        if(!p.passed && p.x+72<bird.x-bird.r){ p.passed=true; score++; document.getElementById('score').textContent=score; }
      }
      if(pipes.length && pipes[pipes.length-1].x < W-188) spawnPipe(W+40);
      pipes=pipes.filter(p=>p.x>-90);
      // collisions: ground / ceiling / pipes
      if(bird.y+bird.r>=PLAY_H || bird.y-bird.r<=0){ bird.y=Math.min(PLAY_H-bird.r,Math.max(bird.r,bird.y)); die(); return; }
      for(const p of pipes){
        const inX = bird.x+bird.r-4>p.x && bird.x-bird.r+4<p.x+72;
        const hitY = bird.y-bird.r+3<p.top || bird.y+bird.r-3>p.top+p.gap;
        if(inX && hitY){ die(); return; }
      }
    } else {
      bird.y=PLAY_H/2 + Math.sin(frame*.12)*7; bird.rot=Math.sin(frame*.12)*0.12;
    }
    draw();
    raf=requestAnimationFrame(step);
  }
  function start(){
    cancelAnimationFrame(raf); reset(); running=true; last=performance.now(); draw();
    raf=requestAnimationFrame(step);
  }
  document.getElementById('startBtn').onclick=start;
  document.getElementById('flapBtn').addEventListener('pointerdown', e=>{ e.preventDefault(); flap(); });
  cv.addEventListener('pointerdown', e=>{ e.preventDefault(); flap(); });
  addEventListener('keydown', e=>{
    if(e.code==='Space'||e.code==='ArrowUp'){ e.preventDefault(); flap(); }
  });
  reset(); draw();
})();
</script>
</body>
</html>
