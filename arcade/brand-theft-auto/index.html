<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brand Theft Auto — RCT Edition</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  body{margin:0;background:#10131a;color:#e8e8e8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;-webkit-user-select:none;user-select:none}
  .wrap{width:min(560px,100%);padding:12px 10px 22px}
  .topbar{background:#173f35;border:2px solid #0b2a22;border-radius:8px;padding:8px 10px;box-shadow:inset 0 0 0 2px #2a6b58}
  .topbar .title{font-family:ui-monospace,Menlo,monospace;font-weight:900;font-size:16px;color:#ffe9a8;letter-spacing:.5px;text-align:center}
  .topbar a.back{color:#9ecbff;text-decoration:none;font-weight:700;font-size:12px;font-family:ui-monospace,Menlo,monospace}
  .chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:7px}
  .chip{background:#0e2a23;border:1px solid #2a6b58;border-radius:20px;padding:3px 9px;font-size:12px;font-weight:700;color:#cfe8dd;font-family:ui-monospace,Menlo,monospace;white-space:nowrap}
  .chip.warn{border-color:#a33;color:#ffb3b3}
  .stage{position:relative;margin-top:10px}
  canvas{display:block;width:100%;height:auto;background:#3f7a34;border:2px solid #0b2a22;border-radius:8px;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
  /* contextual action bar */
  #actions{margin-top:10px;background:#fff;color:#171a22;border:2px solid #e8dcc0;border-radius:12px;padding:10px;display:none}
  #actions.show{display:block}
  #actions .where{font-weight:900;font-size:14px;margin:0 0 8px;color:#7a5b12}
  #actions .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media(max-width:460px){#actions .grid{grid-template-columns:1fr}}
  .act{border:2px solid #222;background:#fff;border-radius:10px;padding:9px;text-align:left;cursor:pointer;color:#171a22;font-family:inherit}
  .act b{display:block;font-size:14.5px}.act span{font-size:12px;color:#666;line-height:1.3}
  .act.primary{background:#35c759;border-color:#17763a;color:#06130a}.act.primary span{color:#174d29}
  /* log */
  #log{margin-top:10px;background:#171b2a;border:1px solid #2b3350;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5;color:#d9deea}
  #log h3{margin:0 0 6px;font-size:12px;letter-spacing:1px;color:#9aa3b2}
  #log div{padding:5px 0;border-bottom:1px solid rgba(255,255,255,.08)}
  #log div:last-child{border:0}
  /* bottom bar: place flavor + dpad */
  .botbar{display:flex;gap:10px;align-items:stretch;margin-top:10px}
  .ticker{flex:1;background:#1b1f27;border:2px solid #333a47;border-radius:8px;padding:9px 11px;font-size:13px;line-height:1.45;color:#c9d2de}
  .ticker b{color:#ffe9a8;display:block;margin-bottom:2px}
  .dpad{position:absolute;left:8px;bottom:8px;z-index:5;display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:4px;touch-action:none}
  .dpad button{border:2px solid rgba(130,140,160,.55);background:rgba(28,33,44,.68);color:#ffe9a8;font-size:17px;border-radius:10px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;padding:0}
  .dpad button.on{background:rgba(255,176,58,.9);color:#111;border-color:#ffb03a}
  .dpad .blank{background:transparent;border-color:transparent}
  .row{display:flex;margin-top:12px}
  .row button{flex:1;border:1px solid #3a4050;border-radius:10px;padding:11px;font-weight:800;cursor:pointer;background:#232733;color:#fff;font-family:inherit}
  .note{text-align:center;color:#8b94a3;font-size:12.5px;margin-top:10px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="../index.html">← All games</a>
    <div class="title">🚗 BRAND THEFT AUTO · RCT EDITION 🚗</div>
    <div class="chips" id="chips1"></div>
    <div class="chips" id="chips2"></div>
  </div>
  <div class="stage">
    <canvas id="game" width="480" height="320"></canvas>
    <div class="dpad" id="dpad">
      <span class="blank"></span><button data-dir="up" aria-label="Up">▲</button><span class="blank"></span>
      <button data-dir="left" aria-label="Left">◀</button><span class="blank"></span><button data-dir="right" aria-label="Right">▶</button>
      <span class="blank"></span><button data-dir="down" aria-label="Down">▼</button><span class="blank"></span>
    </div>
  </div>
  <div id="actions"><p class="where" id="actWhere"></p><div class="grid" id="actGrid"></div></div>
  <div id="log"><h3>📓 WHAT HAPPENED</h3><div id="logBody"></div></div>
  <div class="botbar">
    <div class="ticker"><b id="placeName">🏠 Mom's Crib</b><span id="placeText"></span></div>
  </div>
  <div class="row"><button id="resetBtn">Start over</button></div>
  <p class="note">Walk with the D-pad, WASD, or arrow keys. Step on a door mat to go inside.<br>Walk up to furniture, counters, and people to do stuff. Game saves automatically.</p>
</div>
<script>
(() => {
  const $=id=>document.getElementById(id);
  const clamp=(n,a=0,b=100)=>Math.max(a,Math.min(b,Math.round(n)));
  const pick=a=>a[Math.floor(Math.random()*a.length)];

  // ================= game state (same brain as the original BTA) =================
  const PLACES={
    home:{name:"🏠 Mom's Crib", text:"Home base. Mom's got food, opinions, and a couch with Brandino's name on it."},
    factory:{name:"🔪 Knife Sharpening Factory", text:"The good money. Eight hours of sparks, blades, and trying not to lose a fingertip. Eduardo hangs by the loading dock outside."},
    liquor:{name:"🍾 Liquor Store", text:"Brandino can work the register here — and it's the spot for beer, bottles, and cigs."},
    shotz:{name:"🍸 Shotz", text:"The neighborhood bar. Brandino can only come in to buy drinks… which is honestly enough."},
    bowl:{name:"🎳 West Side Bowl", text:"IT'S OPEN. Lanes are oiled, the rental shoes are questionably sanitized, and Brandino is about to put up a number."},
    hunan:{name:"🥡 Hunan Express", text:"The good Chinese spot next to the Bowl. Plates that undo a whole factory shift, egg rolls that fix a mood."},
    circlek:{name:"⛽ Circle K", text:"Snacks, scratchers, and 24-hour fluorescent-light honesty. Brandino's third home, honestly."},
    town:{name:"🛣️ The Block", text:"Brandino's whole world in a few blocks — Mill Creek Park woods all around and the creek running right past Mom's crib. Both jobs, the bar, the Bowl (open!), Hunan plates and Circle K scratchers."}
  };
  let S;
  function fresh(){
    return {day:1,hour:8,cash:35,earned:0,energy:85,mood:60,health:90,mom:55,
      inv:{beer:0,bottle:0,cigs:1,weed:2},factory:0,liquor:0,drinks:0,
      ateDay:0,momTouchedDay:0,log:["Brandino woke up at Mom's crib with $35 and big dreams."]};
  }
  function save(){ try{ localStorage.setItem('brand-theft-auto-v1',JSON.stringify(S)); }catch(e){} }
  function load(){ try{ const s=JSON.parse(localStorage.getItem('brand-theft-auto-v1')); return s && typeof s.cash==='number' ? s : null; }catch(e){ return null; } }
  function fmtHour(h){ let hh=Math.floor(h), ap=hh>=12?'PM':'AM'; let d=hh%12; if(d===0)d=12; return d+' '+ap; }
  const NAMES=['Brand','Bran','Brando','Brendan','Brundo','Bradbon','Brandoni','Big Bran','Bhad Bhrandon','Brandino'];
  function nz(t){ return t.replace(/Brandino(’s|'s)?/g,(m,poss)=>{ const n=NAMES[Math.floor(Math.random()*NAMES.length)]; return poss? n+poss : n; }); }
  function addLog(t){ S.log.unshift('Day '+S.day+' · '+fmtHour(S.hour)+' — '+nz(t)); S.log=S.log.slice(0,7); }
  function earn(n){ S.cash+=n; S.earned+=n; }
  function spend(n){ if(S.cash<n) return false; S.cash-=n; return true; }
  function touchMom(n){ S.mom=clamp(S.mom+n); S.momTouchedDay=S.day; }
  function passTime(h){
    S.hour+=h;
    if(S.hour>=26){ // 2 AM collapse
      S.day++; S.hour=8; S.energy=55; S.health=clamp(S.health-8); S.mood=clamp(S.mood-8); S.drinks=0;
      addLog('Brandino stayed out way too late and basically passed out. New day, rough start.');
      goHome();
      morningEvent();
    }
  }
  function sleep(){
    const ignored = S.momTouchedDay!==S.day;
    S.day++; S.hour=8; S.drinks=0;
    S.energy=96; S.health=clamp(S.health+8); S.mood=clamp(S.mood+5);
    if(ignored){ S.mom=clamp(S.mom-3); addLog("Brandino slept at Mom's. She noticed he barely said two words to her yesterday. Mom Rep -3."); }
    else { S.mom=clamp(S.mom+1); addLog("Brandino slept at Mom's and woke up to coffee and daytime TV in the kitchen."); }
    morningEvent();
  }
  function morningEvent(){
    if(Math.random()>0.45) return;
    const ev=pick([
      ()=>{ S.mood=clamp(S.mood+7); return 'Mom made Brandino’s favorite breakfast. Elite start to the day.'; },
      ()=>{ S.inv.weed++; return 'Brandino’s cousin swung by last night and left a little weed in the stash.'; },
      ()=>{ S.health=clamp(S.health-4); S.mood=clamp(S.mood-4); return 'The neighbor’s music was bumping through the wall half the night.'; },
      ()=>{ S.energy=clamp(S.energy+6); return 'Brandino actually slept like a baby for once.'; },
      ()=>{ S.mom=clamp(S.mom-4); return 'Mom found Brandino’s dishes in the sink again. She is keeping score.'; }
    ]);
    addLog(ev());
  }
  function randomEvent(where){
    if(Math.random()>0.24) return;
    const common=[
      ()=>{ S.mood=clamp(S.mood+5); return 'A song Brandino loves came on and fixed his whole attitude for an hour.'; },
      ()=>{ S.mood=clamp(S.mood-5); return 'Somebody was driving slow in front of Brandino for no reason. Infuriating.'; },
      ()=>{ S.energy=clamp(S.energy+5); return 'Brandino caught a quick power nap on his break.'; },
      ()=>{ S.inv.weed++; return 'The homie blessed Brandino with a little weed for the stash.'; }
    ];
    const byPlace={
      home:[()=>{ S.mom=clamp(S.mom+4); S.mood=clamp(S.mood+4); return 'Mom was in a good mood and told Brandino a story he’d never heard before.'; },
            ()=>{ S.mood=clamp(S.mood+6); return 'Brandino found the good channel with back-to-back movies.'; }],
      factory:[()=>{ earn(12); return 'A coworker covered part of Brandino’s station, so the shift felt shorter (same pay, better vibes).'; },
               ()=>{ S.health=clamp(S.health-5); S.mood=clamp(S.mood-4); return 'A blade kicked back on the grinder. No stitches, but Brandino felt that one.'; }],
      liquor:[()=>{ S.mood=clamp(S.mood+5); return 'A regular told Brandino he runs the cleanest register in the neighborhood.'; },
              ()=>{ S.mood=clamp(S.mood-5); S.energy=clamp(S.energy-4); return 'Somebody tried to argue about expired coupons at the liquor store. For ten minutes.'; }],
      shotz:[()=>{ S.mood=clamp(S.mood+8); return 'Somebody at Shotz told Brandino he looks like he has his life together. Lying works.'; },
             ()=>{ S.mood=clamp(S.mood-6); return 'A dude at Shotz kept trying to explain crypto to Brandino.'; }],
      bowl:[()=>{ S.mood=clamp(S.mood+6); return 'A little kid at the next lane bowled a strike and the whole place lost it. Infectious joy.'; },
            ()=>{ S.mood=clamp(S.mood-4); return 'Somebody bowled during Brandino’s approach. A formal beef was filed (in his head).'; }],
      hunan:[()=>{ S.mood=clamp(S.mood+5); return 'The fortune cookie said: “A friend will soon bring snacks.” Brandino chooses to believe.'; },
             ()=>{ S.mood=clamp(S.mood+4); return 'Fortune cookie: “You will get exactly what you ordered.” He did. It was this meal.'; }],
      circlek:[()=>{ S.mood=clamp(S.mood+5); return 'The Circle K clerk nodded at Brandino like a fellow night-shift survivor.'; },
               ()=>{ S.energy=clamp(S.energy-3); S.mood=clamp(S.mood-3); return 'The slushie machine was down. A small grief, but a real one.'; }]
    };
    addLog(pick((byPlace[where]||[]).concat(common))());
  }
  function needEnergy(n){ return S.energy>=n; }
  let actPlace='home';
  function act(id){
    const place=actPlace;
    switch(id){
      case 'sleep': sleep(); renderHUD(); return;
      case 'tv': S.mood=clamp(S.mood+8); S.energy=clamp(S.energy-2); addLog('Brandino watched TV on the couch and let his brain idle.'); passTime(1); break;
      case 'eat':
        if(S.ateDay===S.day){ addLog("Mom already fed Brandino today. She's not running a 24-hour diner."); break; }
        if(S.mom<15){ addLog("Mom Rep is too low — Mom told Brandino the kitchen is closed until he acts right."); break; }
        S.ateDay=S.day; S.energy=clamp(S.energy+14); S.health=clamp(S.health+6); S.mood=clamp(S.mood+4); touchMom(2);
        addLog('Brandino ate Mom’s cooking. Elite fuel.'); passTime(1); break;
      case 'chillMom': {
        const lines=['Mom says Brandino needs a haircut, a savings account, and “a plan.”','Mom asked why Brandino’s friends only come over when she cooks.','Mom says the factory is good honest work and Brandino should stick with it.','Mom ranked Brandino’s life choices “not bad, just unfinished.”'];
        touchMom(7); S.mood=clamp(S.mood+6); addLog('Brandino chilled with Mom. '+pick(lines)); passTime(1); break; }
      case 'help': S.energy=clamp(S.energy-8); touchMom(10); S.mood=clamp(S.mood+2); addLog('Brandino helped around the house — trash out, yard touched, dishes handled. Mom saw it.'); passTime(1); break;
      case 'smokeWeed':
        if(S.inv.weed<=0){ addLog('No weed in the stash. Eduardo at the factory can hook Brandino up for $25.'); break; }
        S.inv.weed--; S.mood=clamp(S.mood+15); S.energy=clamp(S.energy-6); S.health=clamp(S.health-1);
        addLog('Brandino smoked and watched the ceiling fan like it was a nature documentary.'); passTime(1); break;
      case 'drinkBeer':
        if(S.inv.beer<=0){ addLog('No beer in the stash. Liquor store run required.'); break; }
        S.inv.beer--; S.drinks++; S.mood=clamp(S.mood+8); S.health=clamp(S.health-2); S.energy=clamp(S.energy-3);
        addLog('Brandino cracked a beer at the crib.'); passTime(1); break;
      case 'drinkBottle':
        if(S.inv.bottle<=0){ addLog('No bottle in the stash. Liquor store run required.'); break; }
        S.inv.bottle--; S.drinks++; S.mood=clamp(S.mood+13); S.health=clamp(S.health-5); S.energy=clamp(S.energy-5);
        addLog('Brandino poured up from the bottle. The night got louder.'); passTime(1); break;
      case 'smokeCig':
        if(S.inv.cigs<=0){ addLog('No cigs. Liquor store sells them — Brandino knows the way.'); break; }
        S.inv.cigs--; S.mood=clamp(S.mood+4); S.health=clamp(S.health-4);
        addLog('Brandino smoked a cig on the porch and thought about absolutely nothing.'); break;
      case 'buyWeed':
        if(spend(25)){ S.inv.weed++; addLog('Brandino bought weed from Eduardo by the loading dock ($25). Eduardo said tell nobody.'); }
        else addLog('Eduardo doesn’t do IOUs. Brandino needs $25 cash.');
        break;
      case 'factoryShift': {
        if(!needEnergy(25)){ addLog('Brandino is too tired to safely work around spinning blades. Sleep first.'); break; }
        earn(144); S.factory++; S.energy=clamp(S.energy-35); S.health=clamp(S.health-3); S.mood=clamp(S.mood-2);
        let extra='';
        const r=Math.random();
        if(r<0.14){ earn(36); extra=' The boss kept him for overtime (+$36).'; passTime(9); }
        else if(r<0.26){ S.health=clamp(S.health-9); S.mood=clamp(S.mood-5); extra=' He nicked his hand on a blade — nothing serious, but it stung all shift.'; passTime(8); }
        else passTime(8);
        addLog('Brandino worked a knife factory shift (+$144).'+extra); break; }
      case 'liquorShift': {
        if(!needEnergy(18)){ addLog('Brandino is too tired to run a register and smile at customers. Sleep first.'); break; }
        earn(90); S.liquor++; S.energy=clamp(S.energy-24); S.mood=clamp(S.mood+1);
        let extra='';
        const r=Math.random();
        if(r<0.22){ const tip=5+Math.floor(Math.random()*16); earn(tip); extra=' A customer tipped him $'+tip+' for carrying bags out.'; }
        else if(r<0.34){ S.mood=clamp(S.mood-6); S.energy=clamp(S.energy-4); extra=' Somebody tried to shoplift and made it everybody’s problem.'; }
        addLog('Brandino worked a liquor store shift (+$90).'+extra); passTime(6); break; }
      case 'buyBeer': if(spend(9)){ S.inv.beer++; addLog('Brandino bought a beer for the stash ($9).'); } else addLog('Not enough cash for beer. Work pays, vibes don’t.'); break;
      case 'buyBottle': if(spend(22)){ S.inv.bottle++; addLog('Brandino bought a bottle for the stash ($22).'); } else addLog('Not enough cash for a bottle. The good stuff waits for payday.'); break;
      case 'buyCigs': if(spend(13)){ S.inv.cigs++; addLog('Brandino bought a pack of cigs ($13).'); } else addLog('Not enough cash for cigs.'); break;
      case 'shotzBeer':
        if(!spend(7)){ addLog('Brandino can’t cover a $7 beer at Shotz. Humbling.'); break; }
        S.drinks++; S.mood=clamp(S.mood+9); S.health=clamp(S.health-2); S.energy=clamp(S.energy-2);
        addLog('Brandino bought a beer at Shotz and posted up like he owned the stool.'); passTime(1); break;
      case 'shotzShot':
        if(!spend(9)){ addLog('Brandino can’t cover a $9 shot at Shotz. The bartender looked away politely.'); break; }
        S.drinks++; S.mood=clamp(S.mood+12); S.health=clamp(S.health-4); S.energy=clamp(S.energy-3);
        addLog('Brandino took a shot at Shotz. Immediate confidence boost.'); passTime(1); break;
      case 'bowlGame': {
        if(!spend(6)){ addLog('Brandino needs $6 to bowl. The shoe guy does not do charity.'); break; }
        const bscore=60+Math.floor(Math.random()*165); let bfl;
        if(bscore>=190) bfl=' He was ON FIRE — somebody from league night asked what team he bowls for.';
        else if(bscore>=140) bfl=' Clean game. The pins feared him.';
        else if(bscore>=100) bfl=' Respectable. Only two gutters, both blamed on the lane.';
        else bfl=' Rough one. The ball had its own plans and they were not Brandino’s.';
        S.energy=clamp(S.energy-4); S.mood=clamp(S.mood+13);
        addLog('Brandino bowled a '+bscore+'.'+bfl); passTime(1); break; }
      case 'buyPlate':
        if(!spend(11)){ addLog('Brandino can’t cover an $11 plate at Hunan. The egg rolls mock him from the warmer.'); break; }
        S.energy=clamp(S.energy+16); S.mood=clamp(S.mood+6); S.health=clamp(S.health+3);
        addLog('Brandino put down a whole Hunan plate. Elite-tier refuel.'); passTime(1); break;
      case 'buyEggRoll':
        if(!spend(4)){ addLog('Not enough for even an egg roll ($4). Humbling.'); break; }
        S.energy=clamp(S.energy+6); S.mood=clamp(S.mood+3);
        addLog('One egg roll, eaten standing up, zero regrets.'); break;
      case 'buySnack':
        if(!spend(4)){ addLog('Not even $4 for a Circle K snack. Dark times.'); break; }
        S.energy=clamp(S.energy+8); S.mood=clamp(S.mood+3); S.health=clamp(S.health+1);
        addLog('Brandino grabbed a Circle K snack and ate it in the parking lot like a king.'); break;
      case 'buyScratcher': {
        if(!spend(5)){ addLog('No $5 for a scratcher. The dream stays unscratched.'); break; }
        const sr=Math.random();
        if(sr<0.10){ earn(50); addLog('THE SCRATCHER HIT FOR $50. Brandino is basically a financial advisor now.'); }
        else if(sr<0.28){ earn(10); addLog('Scratcher paid $10. A free scratcher, technically. Brandino counts it as a win.'); }
        else { S.mood=clamp(S.mood-2); addLog('Scratcher was a dud. The ticket now lives in the parking lot.'); }
        break; }
      case 'bowlDoor': addLog('Brandino tried the West Side Bowl door. Locked for him — the bowling life is a future feature.'); break;
    }
    if(id!=='sleep' && id!=='bowlDoor') randomEvent(place);
    if(S.drinks>=4 && Math.random()<0.5){ S.mood=clamp(S.mood-6); S.energy=clamp(S.energy-6); addLog('Brandino is feeling those drinks. Tomorrow morning might have opinions.'); }
    renderHUD();
  }
  const ACTIONS={
    sleep:['😴 Sleep','Next day · energy back up',1], eat:['🍽️ Eat Mom’s Food','Free · energy + health · once a day',0],
    chillMom:['🛋️ Chill with Mom','Mom Rep + · mood + · 1 hr',0], help:['🧹 Help Around the House','Mom Rep ++ · energy − · 1 hr',0],
    tv:['📺 Watch TV','Mood + · 1 hr',0], smokeWeed:['🌿 Smoke Weed','Needs weed · mood ++ · 1 hr',0],
    drinkBeer:['🍺 Drink a Beer','Needs beer · mood + · 1 hr',0], drinkBottle:['🥃 Drink from the Bottle','Needs a bottle · mood ++ · 1 hr',0],
    smokeCig:['🚬 Smoke a Cig','Needs cigs · mood + · health −',0],
    factoryShift:['🔪 Work Factory Shift','8 hrs · +$144 · the real payday',1], buyWeed:['🌿 Buy Weed from Eduardo','$25 · +1 weed · by the loading dock',0],
    liquorShift:['🧾 Work Liquor Store Shift','6 hrs · +$90 · tips possible',1],
    buyBeer:['🍺 Buy Beer','$9 · adds 1 beer to the stash',0], buyBottle:['🍾 Buy a Bottle','$22 · adds 1 bottle to the stash',0],
    buyCigs:['🚬 Buy Cigs','$13 · adds 1 pack to the stash',0],
    shotzBeer:['🍺 Buy a Beer at Shotz','$7 · drank on the spot · mood +',0], shotzShot:['🥃 Buy a Shot at Shotz','$9 · drank on the spot · mood ++',0],
    bowlGame:['🎳 Bowl a Game','$6 · 1 hr · mood ++ · score posted to the log',1],
    buyPlate:['🍜 Buy a Plate','$11 · 1 hr · energy ++ · mood +',0], buyEggRoll:['🥟 Buy an Egg Roll','$4 · quick bite · energy +',0],
    buySnack:['🍫 Grab a Snack','$4 · eaten on the spot · energy +',0], buyScratcher:['🎟️ Buy a Scratcher','$5 · might hit, probably won’t',0],
    bowlDoor:['🎳 Try the Door','West Side Bowl is not enterable yet',0]
  };

  // ================= isometric pixel engine =================
  const cv=$('game'), ctx=cv.getContext('2d');
  const TW=32, TH=16, OX=240;
  const iso=(i,j,oy)=>[OX+(i-j)*TW/2, oy+(i+j)*TH/2];
  function tilePoly(i,j,oy){ const t=iso(i,j,oy),r=iso(i+1,j,oy),b=iso(i+1,j+1,oy),l=iso(i,j+1,oy);

      '<span class="chip">⚡ '+S.energy+'</span>'+
      '<span class="chip">😊 '+S.mood+'</span>'+
      '<span class="chip">❤️ '+S.health+'</span>'+
      '<span class="chip'+(S.mom<20?' warn':'')+'">💗 Mom '+S.mom+'</span>';
    $('chips2').innerHTML=
      '<span class="chip">🔪 Shifts '+S.factory+'</span>'+
      '<span class="chip">🧾 Shifts '+S.liquor+'</span>'+
      '<span class="chip">🍺 ×'+S.inv.beer+'</span>'+
      '<span class="chip">🍾 ×'+S.inv.bottle+'</span>'+
      '<span class="chip">🚬 ×'+S.inv.cigs+'</span>'+
      '<span class="chip">🌿 ×'+S.inv.weed+'</span>';
    $('logBody').innerHTML=S.log.slice(0,5).map(x=>'<div>'+x+'</div>').join('');
    save();
  }
  function updateActionBar(){
    const s=nearestSpot();
    const key=s?(s.label+'@'+s.p.map(n=>Math.round(n*2)).join(',')):'';
    if(key===curSpotKey) return; curSpotKey=key;
    const bar=$('actions');
    if(!s){ bar.style.display='none'; return; }
    actPlace=s.place;
    bar.style.display='block';
    $('actWhere').textContent='📍 '+s.label;
    $('actGrid').innerHTML=s.acts.map(id=>{ const a=ACTIONS[id];
      return '<button class="act'+(a[2]?' primary':'')+'" data-act="'+id+'"><b>'+a[0]+'</b><span>'+a[1]+'</span></button>'; }).join('');
    bar.querySelectorAll('[data-act]').forEach(b=>{ b.onclick=()=>act(b.dataset.act); });
  }
  function draw(){
    const sc=curScene();
    ctx.fillStyle=scene==='town'?'#2e6630':'#241d16';
    ctx.fillRect(0,0,480,320);
    const mc=iso(sc.w/2,sc.h/2,sc.oy), Z=sc.zoom||1;
    ctx.save(); ctx.translate(240,160); ctx.scale(Z,Z); ctx.translate(-mc[0],-mc[1]);
    if(sc.walls) drawWalls(sc);
    for(let j=0;j<sc.h;j++) for(let i=0;i<sc.w;i++){ tilePoly(i,j,sc.oy); ctx.fillStyle=sc.floor(i,j); ctx.fill(); ctx.strokeStyle='rgba(0,0,0,.08)'; ctx.stroke(); }
    if(sc.water) for(const w of sc.water){ const p=iso(w[0],w[1],sc.oy);
      ctx.fillStyle='rgba(205,232,255,.5)'; ctx.fillRect(p[0]+5,p[1]+4,7,2); ctx.fillRect(p[0]-13,p[1]+9,6,2); ctx.fillRect(p[0]+1,p[1]+12,5,2); }
    drawDoorMats(sc);
    const items=[];
    for(const b of sc.boxes) items.push({d:b.i1+b.j1-1,k:'box',b});
    for(const p of (sc.props||[])) items.push({d:p[0]+p[1]+1,k:'prop',p});
    items.push({d:P.i+P.j+0.5,k:'brand'});
    if(scene==='town'&&sc.eduardo) items.push({d:sc.eduardo[0]+sc.eduardo[1]+0.4,k:'eduardo'});
    if(scene==='home') items.push({d:mom.i+mom.j+0.4,k:'mom'});
    items.sort((a,b)=>a.d-b.d);
    for(const it of items){
      if(it.k==='box') drawBox(it.b,sc.oy);
      else if(it.k==='prop') drawProp(it.p[2],it.p[0],it.p[1],sc.oy);
      else if(it.k==='brand'){ const s=iso(P.i,P.j,sc.oy); drawPeep(s[0],s[1],PAL_B,P.moving&&P.frame?1:0,P.face<0); }
      else if(it.k==='eduardo') drawEduardo(sc.eduardo,0);
      else if(it.k==='mom'){ const s=iso(mom.i,mom.j,sc.oy); drawPeep(s[0],s[1],PAL_M,0,mom.face<0); }
    }
    if(scene==='town'&&Math.hypot(P.i-4,P.j-3)<1.6){ const e=iso(4,3,sc.oy); bubble(e[0],e[1]-46,'psst… $25. you know the deal.'); }
    ctx.restore();
    if(toastT>0){ ctx.font='bold 13px ui-monospace,monospace'; const w=ctx.measureText(toast).width+18;
      ctx.fillStyle='rgba(14,26,22,.88)'; ctx.beginPath(); ctx.roundRect(240-w/2,8,w,24,8); ctx.fill();
      ctx.fillStyle='#ffe9a8'; ctx.textAlign='center'; ctx.fillText(toast,240,24); }
  }

  // ================= input + main loop =================
  const keys={}, held={};
  addEventListener('keydown',e=>{ if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault(); keys[e.key.toLowerCase()]=true; });
  addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
  document.querySelectorAll('#dpad button').forEach(b=>{
    const d=b.dataset.dir;
    const on=e=>{ if(e&&e.preventDefault) e.preventDefault(); held[d]=true; b.classList.add('on'); };
    const off=()=>{ held[d]=false; b.classList.remove('on'); };
    b.addEventListener('pointerdown',on);
    b.addEventListener('pointerup',off); b.addEventListener('pointerleave',off); b.addEventListener('pointercancel',off);
    b.addEventListener('touchstart',on,{passive:false}); // fallback for older WebKit
    b.addEventListener('touchend',off); b.addEventListener('touchcancel',off);
    b.addEventListener('mousedown',on); b.addEventListener('mouseup',off); b.addEventListener('mouseleave',off);
    b.addEventListener('contextmenu',e=>e.preventDefault());
  });
  let last=performance.now(), stepAcc=0;
  function frame(now){
    const dt=Math.min(0.05,(now-last)/1000); last=now;
    if(doorCool>0) doorCool-=dt;
    if(toastT>0) toastT-=dt;
    let mx=0,my=0;
    if(keys['arrowup']||keys['w']||held.up) my-=1;
    if(keys['arrowdown']||keys['s']||held.down) my+=1;
    if(keys['arrowleft']||keys['a']||held.left) mx-=1;
    if(keys['arrowright']||keys['d']||held.right) mx+=1;
    const sc=curScene();
    P.moving=!!(mx||my);
    if(P.moving){
      const len=Math.hypot(mx,my), ux=mx/len, uy=my/len;
      const vx=(ux+uy)*Math.SQRT1_2, vy=(uy-ux)*Math.SQRT1_2; // screen dirs -> grid: pad-up = screen-up, pad-right = screen-right
      const sp=3.4*dt, nx=P.i+vx*sp, ny=P.j+vy*sp;
      if(Math.abs(vx)>0.25) P.face=vx<0?-1:1;
      if(!blockedAt(sc,nx,P.j)) P.i=nx;
      if(!blockedAt(sc,P.i,ny)) P.j=ny;
      stepAcc+=dt; if(stepAcc>0.16){ P.frame=P.frame?0:1; stepAcc=0; }
      if(doorCool<=0){
        const d=sc.doors[Math.floor(P.i)+','+Math.floor(P.j)];
        if(d) switchScene(d.to,d.at[0],d.at[1]);
      }
    } else P.frame=0;
    updateMom(dt);
    updateActionBar();
    draw();
    requestAnimationFrame(frame);
  }
  $('resetBtn').onclick=()=>{ if(confirm('Start Brandino over from Day 1?')){ try{ localStorage.removeItem('brand-theft-auto-v1'); }catch(e){} S=fresh(); switchScene('home',3.5,4.4); renderHUD(); } };
  S=load()||fresh();
  $('placeName').textContent=PLACES.home.name; $('placeText').textContent=nz(PLACES.home.text);
  renderHUD();
  requestAnimationFrame(frame);
  window.__bta={ get S(){return S;}, get scene(){return scene;}, P, mom,
    act:id=>act(id), goto:(s,x,y)=>switchScene(s,x,y),
    setPlace:p=>{ actPlace=p; }, nearest:()=>nearestSpot(),
    setDoorCool:v=>{ doorCool=v; }, key:(k,v)=>{ keys[k]=v; },
    freeIn:(s,x,y)=>!blockedAt(SCENES[s],x,y) };
})();
</script>
