<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05060f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Fractal Maker</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#05060f; touch-action:none; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, sans-serif; }
  #stage { position:fixed; inset:0; display:block; cursor:crosshair; }
  #vignette { position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 52%, rgba(0,0,5,.6) 100%); }
  #hud { position:fixed; top:calc(env(safe-area-inset-top, 0px) + 12px); left:16px; pointer-events:none; user-select:none; -webkit-user-select:none; z-index:5; }
  #hud h1 { color:#fff; font-size:15px; letter-spacing:.35em; font-weight:700; text-shadow:0 2px 12px rgba(0,0,0,.8); }
  #hud h1 span { color:#8ef; }
  #stats { margin-top:6px; color:rgba(255,255,255,.55); font-size:11.5px; letter-spacing:.1em; }
  #palname { margin-top:5px; font-size:11px; letter-spacing:.3em; color:#ffd479; opacity:0; transition:opacity .4s; text-shadow:0 2px 10px rgba(0,0,0,.8); }
  #modes { position:fixed; top:calc(env(safe-area-inset-top, 0px) + 58px); left:0; right:0; z-index:5;
    display:flex; gap:6px; overflow-x:auto; padding:4px 12px 8px; scrollbar-width:none; }
  #modes::-webkit-scrollbar { display:none; }
  #modes button { flex:0 0 auto; border:1px solid rgba(255,255,255,.18); color:rgba(255,255,255,.62);
    background:rgba(12,14,28,.55); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    font-size:10.5px; letter-spacing:.1em; padding:7px 12px; border-radius:999px; cursor:pointer;
    text-transform:uppercase; font-weight:600; white-space:nowrap; transition:all .15s; }
  #modes button.on { color:#070a18; background:#8ef; border-color:#8ef; }
  #controls { position:fixed; bottom:calc(env(safe-area-inset-bottom, 0px) + 18px); left:50%; transform:translateX(-50%);
    display:flex; gap:10px; z-index:5; }
  #controls button { border:1px solid rgba(255,255,255,.22); color:#fff;
    background:rgba(12,14,28,.55); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    font-size:12.5px; letter-spacing:.14em; padding:11px 18px; border-radius:999px; cursor:pointer;
    text-transform:uppercase; font-weight:600; transition:transform .12s, background .2s; white-space:nowrap; }
  #controls button:active { transform:scale(.94); background:rgba(40,44,80,.7); }
  #hint { position:fixed; bottom:calc(env(safe-area-inset-bottom, 0px) + 76px); left:50%; transform:translateX(-50%);
    color:rgba(255,255,255,.8); font-size:12.5px; letter-spacing:.18em; pointer-events:none; user-select:none; -webkit-user-select:none;
    text-shadow:0 2px 10px rgba(0,0,0,.9); transition:opacity .8s; animation:breathe 2.6s ease-in-out infinite; white-space:nowrap; z-index:5; }
  @keyframes breathe { 0%,100%{opacity:.45} 50%{opacity:.95} }
  #hint.gone { opacity:0 !important; animation:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="vignette"></div>
<div id="hud">
  <h1>FRACTAL <span>MAKER</span></h1>
  <div id="stats">warming up…</div>
  <div id="palname"></div>
</div>
<div id="modes"></div>
<div id="hint">tap &nbsp;·&nbsp; click &nbsp;·&nbsp; hold &nbsp;to grow</div>
<div id="controls">
  <button id="btnNew">&#10022; New</button>
  <button id="btnPal">&#9681; Colors</button>
  <button id="btnSave">&#10515; Save</button>
</div>
<script>
"use strict";
/* ============================================================
   FRACTAL MAKER v2 — a whole gallery of fractals in one page.
   BLOOM      the original: infinite tap-to-grow golden-angle garden
   MANDELBROT tap to dive deeper into z²+c  (escape-time)
   JULIA      tap to morph the constant c   (escape-time)
   NEWTON     tap to zoom the root basins   (z³−1 / z⁴−1)
   SNOWFLAKE  tap to fold the Koch snowflake deeper
   DRAGON     tap to fold the dragon curve deeper
   SIERPINSKI tap / hold to scatter chaos-game points
   CANTOR     tap to divide the Cantor set
   MENGER     tap to carve the Menger sponge deeper
   VECTOR MODES (Bloom, Tree, Snowflake, Dragon, Sierpinski, Cantor, Menger)
   draw geometry in WORLD coords straight to a device-pixel cache canvas,
   so lines stay razor sharp at ANY zoom — there is no bitmap to magnify.
   While the camera moves, the cached bitmap is warped (one drawImage, 60fps);
   300ms after it settles, the mode re-renders crisp at the new view.
   Manual pinch/drag/wheel freezes the auto camera (it stays where you put it);
   ✦ or mode switch hands control back to the auto follow.
   TREE now grows to 16 generations (65,536 tips), batched one path per depth.
   ============================================================ */
const TAU = Math.PI * 2;
const GOLDEN = Math.PI * (3 - Math.sqrt(5)); // 137.508° — nature's favorite angle

const PALETTES = [
  { name: "NEBULA", hues: [268, 305, 195], sat: 95,  li: 60 },
  { name: "EMBER",  hues: [14, 36, 348],   sat: 98,  li: 58 },
  { name: "LAGOON", hues: [162, 188, 138], sat: 92,  li: 55 },
  { name: "SUNSET", hues: [322, 18, 48],   sat: 96,  li: 60 },
  { name: "ACID",   hues: [92, 140, 62],   sat: 100, li: 54 },
  { name: "PRISM",  hues: [0, 130, 230],   sat: 100, li: 60 },
  { name: "GHOST",  hues: [215, 215, 215],  sat: 12,  li: 74 }
];

const MAXT = 420;    // max living growth tips (bloom)
const MAXG = 9;      // max branch generation depth (bloom)
const START_X = -430;

const stage = document.getElementById("stage");
const ctx = stage.getContext("2d");
let vw = 0, vh = 0, dpr = 1, bg = null, maxZ = 1;

let seed, rng, P0, turtles, palIdx;
let minX, maxX, minY, maxY, segs, taps;
let cam, introBias, lastTip;
let holding = false, lastHold = 0;
let ripples = [];
let palFlashT = 0;
// crisp vector layer: geometry is drawn in WORLD coords straight to a
// device-pixel cache canvas, so lines stay razor sharp at any zoom —
// never a magnified bitmap. cam lives in world coords too.
let vlc = null, vctx = null, vBasis = null, vNeedCrisp = false, camLock = false, vSettleT = null;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hsl(h, s, l) { // h 0-360, s/l 0-100 → [r,g,b] 0-255
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [(f(0) * 255) | 0, (f(8) * 255) | 0, (f(4) * 255) | 0];
}

function vTouch(x, y) { if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
function vReset() { minX = 1e9; maxX = -1e9; minY = 1e9; maxY = -1e9; }
function vEnsure() {
  const W = Math.max(2, Math.round(vw * dpr)), H = Math.max(2, Math.round(vh * dpr));
  if (!vlc || vlc.width !== W || vlc.height !== H) {
    vlc = document.createElement("canvas"); vlc.width = W; vlc.height = H;
    vctx = vlc.getContext("2d");
    vBasis = null;
  }
}
// world → screen transform for vector drawing (device pixels)
function vApplyCam(c) {
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.translate(vw / 2 + usr.ox, vh / 2 + usr.oy);
  const z = cam.z * usr.z;
  c.scale(z, z);
  c.translate(-cam.x, -cam.y);
}
function vRenderCrisp() {
  // full re-render of the current vector mode at device resolution
  vEnsure();
  const c = vctx;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.globalCompositeOperation = "source-over";
  c.clearRect(0, 0, vlc.width, vlc.height);
  c.globalCompositeOperation = "lighter";
  c.lineCap = c.lineJoin = "round";
  vApplyCam(c);
  MODES[cur].vecDraw();
  vBasis = { cx: cam.x, cy: cam.y, cz: cam.z, ox: usr.ox, oy: usr.oy, oz: usr.z };
  vNeedCrisp = false;
}
function vBasisMatches() {
  if (!vBasis) return false;
  return Math.abs(vBasis.cx - cam.x) < 1e-3 && Math.abs(vBasis.cy - cam.y) < 1e-3 &&
    Math.abs(vBasis.cz - cam.z) / Math.max(1e-9, vBasis.cz) < 1e-4 &&
    Math.abs(vBasis.ox - usr.ox) < 0.5 && Math.abs(vBasis.oy - usr.oy) < 0.5 &&
    Math.abs(vBasis.oz - usr.z) / Math.max(1e-9, vBasis.oz) < 1e-4;
}
function vWarpAmount() {
  // how far the live camera has drifted from the crisp render — big drift = re-render
  if (!vBasis) return 1e9;
  const K0 = vBasis.cz * vBasis.oz, K1 = cam.z * usr.z;
  const s = K1 / Math.max(1e-12, K0);
  const dx = Math.abs(cam.x - vBasis.cx) * K1 + Math.abs(usr.ox - vBasis.ox);
  const dy = Math.abs(cam.y - vBasis.cy) * K1 + Math.abs(usr.oy - vBasis.oy);
  return Math.max(Math.abs(Math.log(Math.max(1e-9, s))), dx / 300, dy / 300);
}
function vWarpDraw() {
  // camera moved since the crisp render: warp the cached bitmap (one drawImage, 60fps)
  const K0 = vBasis.cz * vBasis.oz, K1 = cam.z * usr.z;
  const s = K1 / Math.max(1e-12, K0);
  const T0x = vw / 2 + vBasis.ox, T0y = vh / 2 + vBasis.oy;
  const T1x = vw / 2 + usr.ox, T1y = vh / 2 + usr.oy;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalCompositeOperation = "source-over";
  ctx.translate(T1x - s * T0x + K1 * (vBasis.cx - cam.x), T1y - s * T0y + K1 * (vBasis.cy - cam.y));
  ctx.scale(s, s);
  ctx.drawImage(vlc, 0, 0, vw, vh);
}
function vBlit() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalCompositeOperation = "source-over";
  ctx.drawImage(vlc, 0, 0, vw, vh);
}
function vMotion() {
  // camera is moving — once it settles, re-render crisp if the warp drifted far
  clearTimeout(vSettleT);
  vSettleT = setTimeout(function () { if (vWarpAmount() > 0.12) vNeedCrisp = true; }, 300);
}
function vectorFrame() {
  let moving = false;
  if (!camLock) moving = cameraTick();
  if (moving) vMotion();
  if (vNeedCrisp || !vBasis) vRenderCrisp();
  else if (!vBasisMatches()) vWarpDraw();
  else vBlit();
}
function cameraTick() {
  if (camLock) return false; // user took the camera — it stays exactly where they put it
  const cxp = (minX + maxX) / 2, cyp = (minY + maxY) / 2;
  const bbw = Math.max(1, maxX - minX), bbh = Math.max(1, maxY - minY);
  const tz = Math.min(vw / (bbw * 1.28), vh / (bbh * 1.28), maxZ);
  const tx = cxp + introBias * (0.30 * vw / Math.max(tz, 1e-6));
  const dx = tx - cam.x, dy = cyp - cam.y, dz = tz - cam.z;
  const moved = Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5 || Math.abs(dz) > tz * 0.002;
  cam.x += dx * 0.09;
  cam.y += dy * 0.09;
  cam.z += dz * 0.07;
  return moved;
}
// user camera: pinch-zoom & drag-pan sit on top of the auto camera
let usr = { z: 1, ox: 0, oy: 0 };
function vecWheel(f, mx, my) {
  const Cx = vw / 2, Cy = vh / 2;
  usr.ox = mx - Cx - (mx - Cx - usr.ox) * f;
  usr.oy = my - Cy - (my - Cy - usr.oy) * f;
  usr.z *= f;
}

/* ================= BLOOM (the original infinite garden) ================= */
// every segment is stored (world coords) so the garden can be re-rendered
// razor-sharp at any zoom — no magnified bitmaps, ever
const BSEG_CAP = 400000;
let bstore = null, bsegN = 0;
function bloomStore(x1, y1, x2, y2, w, gen, t) {
  if (!bstore) bstore = new Float32Array(BSEG_CAP * 7);
  if (bsegN >= BSEG_CAP) return;
  const o = bsegN * 7;
  bstore[o] = x1; bstore[o + 1] = y1; bstore[o + 2] = x2; bstore[o + 3] = y2;
  bstore[o + 4] = w; bstore[o + 5] = gen; bstore[o + 6] = t;
  bsegN++;
}
function bloomRestroke() {
  const pal = PALETTES[palIdx];
  for (let k = 0; k < bsegN; k++) {
    const o = k * 7, gen = bstore[o + 5] | 0, t = bstore[o + 6];
    const hue = (pal.hues[gen % pal.hues.length] + t * 0.12 + gen * 17) % 360;
    vctx.strokeStyle = "hsla(" + hue.toFixed(1) + "," + pal.sat + "%," +
      Math.min(74, 54 + gen * 2.2).toFixed(1) + "%,0.85)";
    vctx.lineWidth = Math.max(0.5, bstore[o + 4]);
    vctx.beginPath();
    vctx.moveTo(bstore[o], bstore[o + 1]);
    vctx.lineTo(bstore[o + 2], bstore[o + 3]);
    vctx.stroke();
  }
}
function bloomVecDraw() {
  const pal = PALETTES[palIdx];
  const g = vctx.createRadialGradient(START_X, 0, 0, START_X, 0, 26);
  g.addColorStop(0, "hsla(" + pal.hues[0] + "," + pal.sat + "%,82%,1)");
  g.addColorStop(1, "hsla(0,0%,0%,0)");
  vctx.fillStyle = g;
  vctx.fillRect(START_X - 26, -26, 52, 52);
  bloomRestroke();
}
function bloomNew() {
  seed = (Math.random() * 0xffffff) | 0;
  rng = mulberry32(seed);
  P0 = {
    baseTurn:  (rng() - 0.5) * 0.24,
    waveAmp:   0.25 + rng() * 0.75,
    waveFreq:  0.015 + rng() * 0.075,
    jitter:    0.35 + rng() * 0.55,
    branchP:   0.025 + rng() * 0.075,
    branchAng: GOLDEN * (0.55 + rng() * 0.9),
    stepLen:   6.5 + rng() * 5,
    lenDecay:  0.962 + rng() * 0.025
  };
  palIdx = (rng() * PALETTES.length) | 0;
  turtles = [{ x: START_X, y: 0, a: (rng() - 0.5) * 0.6, gen: 0, t: 0, phase: rng() * TAU, alive: true }];
  lastTip = { x: START_X, y: 0, a: 0 };
  minX = maxX = START_X; minY = maxY = 0;
  segs = 0; taps = 0; introBias = 1; ripples = [];
  bsegN = 0;
  camLock = false;
  cam = { x: START_X, y: 0, z: maxZ };
  vNeedCrisp = true;
}
function bloomGrow(px, py) {
  taps++;
  const kids = [];
  const pal = PALETTES[palIdx];
  vEnsure();
  vApplyCam(vctx);
  let aliveCount = 0;
  for (const tu of turtles) if (tu.alive) aliveCount++;
  for (const tu of turtles) {
    if (!tu.alive) continue;
    const steps = tu.gen < 3 ? 26 : tu.gen < 6 ? 14 : 7;
    const len = P0.stepLen * Math.pow(P0.lenDecay, tu.gen);
    for (let s = 0; s < steps; s++) {
      tu.a += P0.baseTurn * (0.5 + rng())
            + P0.waveAmp * 0.35 * Math.sin(tu.t * P0.waveFreq + tu.phase)
            + (rng() - 0.5) * P0.jitter;
      tu.t++;
      const nx = tu.x + Math.cos(tu.a) * len;
      const ny = tu.y + Math.sin(tu.a) * len;
      const w = Math.max(0.5, 5.2 * Math.pow(0.78, tu.gen) + 0.5);
      const hue = (pal.hues[tu.gen % pal.hues.length] + tu.t * 0.12 + tu.gen * 17) % 360;
      vctx.strokeStyle = "hsla(" + hue.toFixed(1) + "," + pal.sat + "%," +
        Math.min(74, 54 + tu.gen * 2.2).toFixed(1) + "%,0.85)";
      vctx.lineWidth = w;
      vctx.beginPath();
      vctx.moveTo(tu.x, tu.y);
      vctx.lineTo(nx, ny);
      vctx.stroke();
      bloomStore(tu.x, tu.y, nx, ny, w, tu.gen, tu.t);
      tu.x = nx; tu.y = ny; segs++;
      vTouch(nx, ny);
      const bp = P0.branchP * (1 - tu.gen / MAXG);
      if (rng() < bp && aliveCount + kids.length < MAXT) {
        const dir = rng() < 0.5 ? -1 : 1;
        const ka = rng() < 0.14
          ? tu.a + dir * Math.PI * 0.5 * (0.8 + rng() * 0.4)
          : tu.a + dir * P0.branchAng * (0.75 + rng() * 0.5);
        kids.push({ x: tu.x, y: tu.y, a: ka, gen: tu.gen + 1, t: 0, phase: rng() * TAU, alive: true });
      }
      if (rng() < 0.0025) tu.alive = false;
      lastTip.x = nx; lastTip.y = ny; lastTip.a = tu.a;
    }
  }
  if (kids.length) { turtles.push.apply(turtles, kids); aliveCount += kids.length; }
  if (turtles.length > MAXT * 2) turtles = turtles.filter(t => t.alive);
  if (aliveCount > MAXT) {
    let kill = aliveCount - MAXT;
    for (const tu of turtles) { if (kill <= 0) break; if (tu.alive) { tu.alive = false; kill--; } }
    aliveCount = MAXT;
  }
  if (aliveCount === 0) {
    turtles.push({ x: lastTip.x, y: lastTip.y, a: lastTip.a + (rng() - 0.5), gen: 0, t: 0, phase: rng() * TAU, alive: true });
  }
  if (px !== undefined) ripples.push({ x: px, y: py, t0: performance.now() });
  introBias = Math.max(0, introBias - 0.3);
}

/* ============ ESCAPE-TIME ENGINE (mandelbrot / julia / newton) ============ */
const ESC = { cvs: null, x: null, img: null, W: 0, H: 0, job: null };
const JULIA_PRETTY = [
  [-0.7, 0.27015], [-0.8, 0.156], [-0.7269, 0.1889], [-0.835, -0.2321],
  [0.285, 0.01], [-0.4, 0.6], [-0.70176, -0.3842], [-0.75, 0.11]
];
const NEWTON_POLYS = [
  { name: "z³−1", deg: 3, roots: [[1, 0], [-0.5, 0.8660254], [-0.5, -0.8660254]] },
  { name: "z⁴−1", deg: 4, roots: [[1, 0], [-1, 0], [0, 1], [0, -1]] }
];
let fineT = null; // idle timer that kicks off the crisp refine pass
function escStart(job, quality) {
  clearTimeout(fineT);
  quality = quality || "fast";
  const sc = quality === "fine" ? 0.75 : 0.4; // fast preview while interacting, crisp refine when idle
  let W = Math.round(vw * sc), H = Math.round(vh * sc);
  const cf = Math.min(1, 900 / W, 900 / H);
  W = Math.max(120, Math.round(W * cf)); H = Math.max(120, Math.round(H * cf));
  ESC.W = W; ESC.H = H;
  ESC.cvs = document.createElement("canvas");
  ESC.cvs.width = W; ESC.cvs.height = H;
  ESC.x = ESC.cvs.getContext("2d");
  ESC.img = ESC.x.createImageData(W, H);
  const d = ESC.img.data;
  for (let i = 3; i < d.length; i += 4) d[i] = 0;
  job.W = W; job.H = H; job.row = 0;
  job.unit = job.size / W;
  job.quality = quality;
  ESC.job = job;
  ESC.rv = { cx: job.cx, cy: job.cy, size: job.size }; // the view this bitmap was rendered with
  VG = null;
}
function scheduleFine() {
  // after the fast preview finishes and things go quiet, re-render crisp
  clearTimeout(fineT);
  fineT = setTimeout(function () {
    const M = MODES[cur];
    if (M && M.isEscape && !ESC.job && !VG && PTRS.size === 0) escStart(M.job(), "fine");
  }, 500);
}
// ---- iteration probes (shared by the renderer and the region sampler) ----
function mProbe(cr, ci, maxIter) {
  let zr = 0, zi = 0, n = 0, r2 = 0;
  const q = (cr - 0.25) * (cr - 0.25) + ci * ci;
  if (q * (q + (cr - 0.25)) < 0.25 * ci * ci || (cr + 1) * (cr + 1) + ci * ci < 0.0625) return { n: maxIter, r2: 0 };
  while (n < maxIter && (r2 = zr * zr + zi * zi) <= 4) {
    const t = zr * zr - zi * zi + cr;
    zi = 2 * zr * zi + ci; zr = t; n++;
  }
  return { n, r2 };
}
function jProbe(zr, zi, cRe, cIm, maxIter) {
  let n = 0, r2 = 0;
  while (n < maxIter && (r2 = zr * zr + zi * zi) <= 4) {
    const t = zr * zr - zi * zi + cRe;
    zi = 2 * zr * zi + cIm; zr = t; n++;
  }
  return { n, r2 };
}
function nProbe(zr, zi, deg, roots, maxIter) {
  let n = 0, ri = -1;
  for (; n < maxIter; n++) {
    let pr = zr, pi = zi;
    for (let k = 2; k < deg; k++) { const t = pr * zr - pi * zi; pi = pr * zi + pi * zr; pr = t; }
    const zdr = pr * zr - pi * zi, zdi = pr * zi + pi * zr;
    const fr = zdr - 1, fi = zdi;
    if (fr * fr + fi * fi < 1e-8) break;
    const dr = deg * pr, di = deg * pi;
    const den = dr * dr + di * di;
    if (den < 1e-12) break;
    zr -= (fr * dr + fi * di) / den;
    zi -= (fi * dr - fr * di) / den;
    if (zr * zr + zi * zi > 1e6) break;
  }
  if (n < maxIter) {

MODES.snowflake = vectorMode("Snowflake", "tap to fold it deeper", 7, kochRender,
  n => "KOCH SNOWFLAKE · iteration " + n + " · " + PALETTES[palIdx].name);
MODES.dragon = vectorMode("Dragon", "tap to fold it deeper", 14, dragonRender,
  n => "DRAGON CURVE · iteration " + n + " · " + PALETTES[palIdx].name);
MODES.cantor = vectorMode("Cantor", "tap to divide it", 11, cantorRender,
  n => "CANTOR SET · row " + n + " · " + PALETTES[palIdx].name);
MODES.menger = vectorMode("Menger", "tap to carve it deeper", 3, mengerRender,
  n => "MENGER SPONGE · level " + n + " · " + PALETTES[palIdx].name);
MODES.tree = Object.assign(vectorMode("Tree", "tap to grow it deeper", 16, treeFull,
  n => "FRACTAL TREE · generation " + n + " · " + PALETTES[palIdx].name), {
  enter() {
    // every tree rolls its own botany: angle, taper, asymmetry, curl
    treeSeed = (Math.random() * 0xffffff) | 0;
    treeP = {
      angle: (18 + rng() * 14) * Math.PI / 180,
      asym: (rng() - 0.5) * 0.35,
      ratio: 0.68 + rng() * 0.12,
      wRatio: 0.62 + rng() * 0.12,
      curl: (rng() - 0.5) * 0.45
    };
    this.n = 0; introBias = 0; camLock = false; cam = { x: 0, y: 0, z: maxZ }; vNeedCrisp = true;
  }
});
MODES.sierpinski = {
  name: "Sierpinski", hint: "tap · hold to scatter · pinch to zoom · drag to pan", st: null,
  enter() { seed = (Math.random() * 0xffffff) | 0; rng = mulberry32(seed); this.st = sierpinskiEnter(); vNeedCrisp = true; },
  tap(x, y) { vEnsure(); vApplyCam(vctx); sierpinskiScatter(this.st, 12000); ripples.push({ x, y, t0: performance.now() }); },
  holdTick() { vEnsure(); vApplyCam(vctx); sierpinskiScatter(this.st, 4000); },
  reset() { this.enter(); },
  onPalette() { vNeedCrisp = true; },
  wheelVec: vecWheel,
  vecDraw() { sierpinskiVecDraw(this.st); },
  draw() { vectorFrame(); },
  stats() { return "SIERPINSKI · " + this.st.n.toLocaleString("en-US") + " points · " + PALETTES[palIdx].name; }
};

/* ==================== UI ==================== */
function setMode(id) {
  ESC.job = null;
  VG = null;
  usr = { z: 1, ox: 0, oy: 0 };
  camLock = false; vBasis = null; vNeedCrisp = false;
  clearTimeout(wheelT);
  cur = id;
  ripples = [];
  document.querySelectorAll("#modes button").forEach(b => b.classList.toggle("on", b.dataset.id === id));
  const M = MODES[id];
  M.enter();
  const hint = document.getElementById("hint");
  hint.innerHTML = M.hint;
  hint.classList.remove("gone");
  if (id === "bloom") setTimeout(() => { if (cur === "bloom" && taps >= 3) hint.classList.add("gone"); }, 100);
  updateStats();
}
function updateStats() {
  const s = MODES[cur].stats();
  document.getElementById("stats").textContent = s || "·";
}
function flashPalette() {
  const pn = document.getElementById("palname");
  pn.textContent = "◑ " + PALETTES[palIdx].name;
  pn.style.opacity = 1;
  palFlashT = performance.now() + 1600;
}
function buildModeBar() {
  const bar = document.getElementById("modes");
  ORDER.forEach(id => {
    const b = document.createElement("button");
    b.textContent = MODES[id].name;
    b.dataset.id = id;
    b.addEventListener("click", e => { e.stopPropagation(); setMode(id); });
    bar.appendChild(b);
  });
}

function buildBg() {
  bg = document.createElement("canvas");
  bg.width = Math.max(1, vw); bg.height = Math.max(1, vh);
  const b = bg.getContext("2d");
  const gr = b.createLinearGradient(0, 0, 0, vh);
  gr.addColorStop(0, "#070a18"); gr.addColorStop(0.55, "#05060f"); gr.addColorStop(1, "#0a0616");
  b.fillStyle = gr; b.fillRect(0, 0, vw, vh);
  const sr = mulberry32(1234567);
  for (let i = 0; i < 220; i++) {
    b.fillStyle = "rgba(200,220,255," + (0.12 + sr() * 0.5).toFixed(2) + ")";
    b.beginPath(); b.arc(sr() * vw, sr() * vh, sr() * 1.3 + 0.2, 0, TAU); b.fill();
  }
}
function resize() {
  vw = window.innerWidth; vh = window.innerHeight;
  dpr = Math.min(2, window.devicePixelRatio || 1);
  stage.width = Math.round(vw * dpr); stage.height = Math.round(vh * dpr);
  stage.style.width = vw + "px"; stage.style.height = vh + "px";
  buildBg();
  maxZ = Math.min(vw, vh) / 560;
}
window.addEventListener("resize", resize);

function frame(now) {
  requestAnimationFrame(frame);
  const M = MODES[cur];
  if (M.pump) M.pump();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.drawImage(bg, 0, 0, vw, vh);
  M.draw(now);
  ripples = ripples.filter(r => now - r.t0 < 650);
  for (const r of ripples) {
    const age = (now - r.t0) / 650;
    ctx.strokeStyle = "rgba(255,255,255," + ((1 - age) * 0.45).toFixed(3) + ")";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + age * 90, 0, TAU); ctx.stroke();
  }
  if (holding && PTRS.size === 1 && holdArmed && M.holdTick && now - lastHold > 90) { lastHold = now; M.holdTick(); }
  const pn = document.getElementById("palname");
  if (palFlashT && now > palFlashT) { palFlashT = 0; pn.style.opacity = 0; }
  if (M.stats) {
    const s = M.stats();
    const el = document.getElementById("stats");
    if (el.textContent !== s) el.textContent = s;
  }
}

// ---- gesture input: tap = grow · 1-finger drag = pan · 2-finger pinch = zoom · wheel = zoom ----
const PTRS = new Map();
let downInfo = null, pinchSt = null, panSt = null, holdArmed = false, wheelT = null;
function escViewOf(M) { return { cx: M.cx, cy: M.cy, size: M.size }; }
function startPinch() {
  const p = [...PTRS.values()];
  pinchSt = {
    d0: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 1,
    m0x: (p[0].x + p[1].x) / 2, m0y: (p[0].y + p[1].y) / 2,
    v0: null, u0: { z: usr.z, ox: usr.ox, oy: usr.oy }, nV: null
  };
  const M = MODES[cur];
  if (M.isEscape) pinchSt.v0 = escViewOf(M);
  if (downInfo) downInfo.moved = true;
}
function movePinch() {
  const p = [...PTRS.values()];
  const d1 = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 1;
  const m1x = (p[0].x + p[1].x) / 2, m1y = (p[0].y + p[1].y) / 2;
  const M = MODES[cur];
  const f = d1 / pinchSt.d0;
  if (M.isEscape) {
    const z = cFromCss(pinchSt.m0x, pinchSt.m0y, pinchSt.v0);
    const nV = viewForAnchor(z, m1x, m1y, Math.max(1e-9, pinchSt.v0.size / f));
    pinchSt.nV = nV;
    M.gestPreview(nV);
  } else {
    const u0 = pinchSt.u0, Cx = vw / 2, Cy = vh / 2;
    usr.z = u0.z * f;
    usr.ox = m1x - Cx - (pinchSt.m0x - Cx - u0.ox) * f;
    usr.oy = m1y - Cy - (pinchSt.m0y - Cy - u0.oy) * f;
    camLock = true; vMotion(); // user took the camera — freeze the auto follow
  }
}
function movePan(x, y) {
  const M = MODES[cur];
  if (!panSt) {
    panSt = { x0: downInfo.x, y0: downInfo.y, v0: M.isEscape ? escViewOf(M) : null, nV: null };
  }
  if (M.isEscape) {
    const z = cFromCss(panSt.x0, panSt.y0, panSt.v0);
    const nV = viewForAnchor(z, x, y, panSt.v0.size);
    panSt.nV = nV;
    M.gestPreview(nV);
  } else {
    usr.ox += x - downInfo.lx;
    usr.oy += y - downInfo.ly;
    camLock = true; vMotion(); // user took the camera — freeze the auto follow
  }
}
function commitGest() {
  const M = MODES[cur];
  if (M.isEscape) {
    const nV = (pinchSt && pinchSt.nV) || (panSt && panSt.nV);
    if (nV) M.gestCommit(nV);
  }
}
stage.addEventListener("pointerdown", function (e) {
  PTRS.set(e.pointerId, { x: e.clientX, y: e.clientY });
  holding = true;
  if (PTRS.size === 1) {
    downInfo = { x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, moved: false };
    holdArmed = true; lastHold = performance.now();
  } else if (PTRS.size === 2) {
    holdArmed = false;
    panSt = null;
    startPinch();
  }
  e.preventDefault();
});
stage.addEventListener("pointermove", function (e) {
  if (!PTRS.has(e.pointerId)) return;
  PTRS.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (PTRS.size === 2 && pinchSt) { movePinch(); return; }
  if (PTRS.size === 1 && downInfo) {
    const dx = e.clientX - downInfo.x, dy = e.clientY - downInfo.y;
    if (!downInfo.moved && Math.hypot(dx, dy) > 10) { downInfo.moved = true; holdArmed = false; }
    if (downInfo.moved) movePan(e.clientX, e.clientY);
    downInfo.lx = e.clientX; downInfo.ly = e.clientY;
  }
});
function endPointer(e) {
  PTRS.delete(e.pointerId);
  const M = MODES[cur];
  if (PTRS.size === 0) {
    commitGest();
    if (downInfo && !downInfo.moved && holdArmed) M.tap(downInfo.x, downInfo.y);
    downInfo = null; pinchSt = null; panSt = null; holdArmed = false; holding = false;
  } else if (PTRS.size === 1) {
    // pinch collapsed to one finger: commit, no accidental tap after
    commitGest();
    pinchSt = null; panSt = null;
    const p = [...PTRS.values()][0];
    downInfo = { x: p.x, y: p.y, lx: p.x, ly: p.y, moved: true };
    holdArmed = false;
  }
}
stage.addEventListener("pointerup", endPointer);
stage.addEventListener("pointercancel", endPointer);
stage.addEventListener("wheel", function (e) {
  e.preventDefault();
  const M = MODES[cur];
  const f = Math.exp(-e.deltaY * 0.0012);
  if (M.isEscape) {
    const V = { cx: M.cx, cy: M.cy, size: M.size };
    const z = cFromCss(e.clientX, e.clientY, V);
    const nV = viewForAnchor(z, e.clientX, e.clientY, Math.max(1e-9, V.size / f));
    M.cx = nV.cx; M.cy = nV.cy; M.size = nV.size;
    VG = warpFor(ESC.rv, nV);
    clearTimeout(wheelT);
    wheelT = setTimeout(function () { VG = null; escStart(M.job()); }, 200);
  } else if (M.wheelVec) {
    M.wheelVec(f, e.clientX, e.clientY);
    camLock = true; vMotion(); // user took the camera — freeze the auto follow
  }
}, { passive: false });
window.addEventListener("contextmenu", function (e) { e.preventDefault(); });
document.addEventListener("gesturestart", function (e) { e.preventDefault(); });

document.getElementById("btnNew").addEventListener("click", function (e) {
  e.stopPropagation(); MODES[cur].reset(); updateStats(); flashPalette();
});
document.getElementById("btnPal").addEventListener("click", function (e) {
  e.stopPropagation();
  palIdx = (palIdx + 1) % PALETTES.length;
  MODES[cur].onPalette();
  flashPalette(); updateStats();
});
document.getElementById("btnSave").addEventListener("click", function (e) {
  e.stopPropagation();
  stage.toBlob(function (blob) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "fractal-" + cur + "-" + Date.now().toString(36) + ".png";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
  });
});
window.addEventListener("keydown", function (e) {
  if (e.code === "Space") { e.preventDefault(); MODES[cur].tap(vw / 2, vh / 2); }
  else if (e.key === "n" || e.key === "N") MODES[cur].reset();
  else if (e.key === "c" || e.key === "C") document.getElementById("btnPal").click();
  else if (e.key >= "1" && e.key <= "9") setMode(ORDER[+e.key - 1]);
  else if (e.key === "0") setMode(ORDER[9]);
});

// ---- go ----
seed = (Math.random() * 0xffffff) | 0;
rng = mulberry32(seed);
palIdx = 0;
resize();
buildModeBar();
setMode("bloom");
requestAnimationFrame(frame);
</script>
</body>
</html>
