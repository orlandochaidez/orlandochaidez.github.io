<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05060f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Fractals</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#05060f; touch-action:none; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, sans-serif; }
  #stage { position:fixed; inset:0; display:block; cursor:crosshair; }
  #vignette { position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 52%, rgba(0,0,5,.6) 100%); }
  #hud { position:fixed; top:calc(env(safe-area-inset-top, 0px) + 12px); left:16px; pointer-events:none; user-select:none; -webkit-user-select:none; z-index:5; }
  #hud h1 { color:#fff; font-size:15px; letter-spacing:.35em; font-weight:700; text-shadow:0 2px 12px rgba(0,0,0,.8); }
  #hud h1 span { color:#8ef; }
  #stats { margin-top:6px; color:rgba(255,255,255,.55); font-size:11.5px; letter-spacing:.1em; }
  #palname { margin-top:5px; font-size:11px; letter-spacing:.3em; color:#ffd479; opacity:0; transition:opacity .4s; text-shadow:0 2px 10px rgba(0,0,0,.8); }
  #modes { position:fixed; top:calc(env(safe-area-inset-top, 0px) + 58px); left:0; right:0; z-index:5;
    display:flex; gap:6px; overflow-x:auto; padding:4px 12px 8px; scrollbar-width:none; }
  #modes::-webkit-scrollbar { display:none; }
  #modes button { flex:0 0 auto; border:1px solid rgba(255,255,255,.18); color:rgba(255,255,255,.62);
    background:rgba(12,14,28,.55); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    font-size:10.5px; letter-spacing:.1em; padding:7px 12px; border-radius:999px; cursor:pointer;
    text-transform:uppercase; font-weight:600; white-space:nowrap; transition:all .15s; }
  #modes button.on { color:#070a18; background:#8ef; border-color:#8ef; }
  #controls { position:fixed; bottom:calc(env(safe-area-inset-bottom, 0px) + 18px); left:50%; transform:translateX(-50%);
    display:flex; gap:10px; z-index:5; }
  #controls button { border:1px solid rgba(255,255,255,.22); color:#fff;
    background:rgba(12,14,28,.55); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    font-size:12.5px; letter-spacing:.14em; padding:11px 18px; border-radius:999px; cursor:pointer;
    text-transform:uppercase; font-weight:600; transition:transform .12s, background .2s; white-space:nowrap; }
  #controls button:active { transform:scale(.94); background:rgba(40,44,80,.7); }
  #btn3D.on { color:#070a18; background:#8ef; border-color:#8ef; }
  #hint { position:fixed; bottom:calc(env(safe-area-inset-bottom, 0px) + 76px); left:50%; transform:translateX(-50%);
    color:rgba(255,255,255,.8); font-size:12.5px; letter-spacing:.18em; pointer-events:none; user-select:none; -webkit-user-select:none;
    text-shadow:0 2px 10px rgba(0,0,0,.9); transition:opacity .8s; animation:breathe 2.6s ease-in-out infinite; white-space:nowrap; z-index:5; }
  @keyframes breathe { 0%,100%{opacity:.45} 50%{opacity:.95} }
  #hint.gone { opacity:0 !important; animation:none; }
  @media (max-width:480px) {
    /* small phones: compact the chrome so no button gets cut off */
    #controls { gap:6px; padding:0 8px; max-width:100vw; flex-wrap:nowrap; justify-content:center; }
    #controls button { font-size:10px; letter-spacing:.05em; padding:8px 10px; white-space:nowrap; }
    #hint { bottom:calc(env(safe-area-inset-bottom, 0px) + 88px); font-size:10.5px; letter-spacing:.08em;
      white-space:normal; text-align:center; max-width:88vw; line-height:1.7; }
    #modes button { font-size:10px; padding:6px 10px; }
    #hud h1 { font-size:13px; }
    #stats { font-size:10.5px; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="vignette"></div>
<div id="hud">
  <h1>FRACTALS</h1>
  <div id="stats">warming up…</div>
  <div id="palname"></div>
</div>
<div id="modes"></div>
<div id="hint">tap &nbsp;·&nbsp; click &nbsp;·&nbsp; hold &nbsp;to grow</div>
<div id="controls">
  <button id="btnNew">&#10022; New</button>
  <button id="btnFit">&#9956; Fit</button>
  <button id="btn3D" style="display:none">&#11042; 3D</button>
  <button id="btnRoots" style="display:none">&#10070; Roots</button>
  <button id="btnPal">&#9681; Colors</button>
  <button id="btnSave">&#10515; Save</button>
</div>
<script>
"use strict";
/* ============================================================
   FRACTAL MAKER v2 — a whole gallery of fractals in one page.
   BLOOM      the original: infinite tap-to-grow golden-angle garden
   MANDELBROT pinch or scroll to zoom, sharper as it settles, detail appears the deeper you go (reseeds past 1e12×)
   JULIA      same camera · tap dives · ✦ rolls a new constant
   SNOWFLAKE  tap to fold the Koch snowflake deeper
   DRAGON     tap to fold the dragon curve deeper
   SIERPINSKI tap to split the triangle deeper (1 → 3 → 9 → 27…)
   CANTOR     tap to divide the Cantor set
   MENGER     tap to carve the Menger sponge deeper
   GOLDEN     Seedline golden spiral: one mark, tap/hold packs new seeds on the golden angle
   FERN       Seedline fern: one mark, tap/hold grows curling fronds with new heads
   VINE       Seedline spiral vine: one mark, tap/hold curls a vine with side tendrils
   VECTOR MODES (Bloom, Tree, Snowflake, Dragon, Sierpinski, Cantor, Menger)
   draw geometry in WORLD coords straight to a device-pixel cache canvas,
   so lines stay razor sharp at ANY zoom — there is no bitmap to magnify.
   While the camera moves, the cached bitmap is warped (one drawImage, 60fps);
   300ms after it settles, the mode re-renders crisp at the new view.
   Manual pinch/drag/wheel freezes the auto camera (it stays where you put it);
   ✦ or mode switch hands control back to the auto follow.
   TREE grows to 18 generations (262,144 tips), batched one path per depth.
   BLOOM 3D: the ⬢ 3D button (Bloom only) switches to an orbit camera —
   same garden in true 3D. Drag orbits, pinch/wheel/Z/X dolly, arrows orbit,
   ⛶ Fit reframes. 2D math is byte-for-byte unchanged.
   ============================================================ */
const TAU = Math.PI * 2;
const GOLDEN = Math.PI * (3 - Math.sqrt(5)); // 137.508° — nature's favorite angle

const PALETTES = [
  { name: "PRISM", hues: [0, 130, 230],   sat: 100, li: 60 },
  { name: "GHOST", hues: [215, 215, 215], sat: 12,  li: 74 },
  { name: "ACID",  hues: [0, 32, 58, 135, 232, 268, 292], sat: 100, li: 56 }, // ROYGBIV only
  { name: "NOIR",  hues: [275, 290, 230, 190, 315], sat: 55, li: 52 } // deep purple · violet · slate · ice cyan · magenta
];

const MAXT = 640;    // max living growth tips (bloom)
const MAXG = 14;     // max branch generation depth (bloom)
const START_X = -430;

const stage = document.getElementById("stage");
const ctx = stage.getContext("2d");
let vw = 0, vh = 0, dpr = 1, bg = null, maxZ = 1;

let seed, rng, zrng, P0, turtles, palIdx;
let minX, maxX, minY, maxY, segs, taps;
let cam, introBias, lastTip;
let holding = false, lastHold = 0;
let ripples = [];
let palFlashT = 0;
// crisp vector layer: geometry is drawn in WORLD coords straight to a
// device-pixel cache canvas, so lines stay razor sharp at any zoom —
// never a magnified bitmap. cam lives in world coords too.
let vlc = null, vctx = null, vBasis = null, vNeedCrisp = false, camLock = false, vSettleT = null;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hsl(h, s, l) { // h 0-360, s/l 0-100 → [r,g,b] 0-255
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [(f(0) * 255) | 0, (f(8) * 255) | 0, (f(4) * 255) | 0];
}

function vTouch(x, y) { if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
let bMinZ = 0, bMaxZ = 0;
function vTouch3(x, y, z) {
  vTouch(x, y);
  if (z < bMinZ) bMinZ = z;
  if (z > bMaxZ) bMaxZ = z;
}
function vReset() { minX = 1e9; maxX = -1e9; minY = 1e9; maxY = -1e9; }
function vEnsure() {
  const W = Math.max(2, Math.round(vw * dpr)), H = Math.max(2, Math.round(vh * dpr));
  if (!vlc || vlc.width !== W || vlc.height !== H) {
    vlc = document.createElement("canvas"); vlc.width = W; vlc.height = H;
    vctx = vlc.getContext("2d");
    vBasis = null;
  }
}
// world → screen transform for vector drawing (device pixels)
function vApplyCam(c) {
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.translate(vw / 2 + usr.ox, vh / 2 + usr.oy);
  const z = cam.z * usr.z;
  c.scale(z, z);
  c.translate(-cam.x, -cam.y);
}
function vRenderCrisp() {
  // full re-render of the current vector mode at device resolution
  vEnsure();
  const c = vctx;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.globalCompositeOperation = "source-over";
  c.clearRect(0, 0, vlc.width, vlc.height);
  // NOTE: stays source-over (no "lighter"): additive blending turned hundreds of
  // overlapping lines white. clean lines keep their exact color at any density.
  c.lineCap = c.lineJoin = "round";
  vApplyCam(c);
  MODES[cur].vecDraw();
  vBasis = { cx: cam.x, cy: cam.y, cz: cam.z, ox: usr.ox, oy: usr.oy, oz: usr.z };
  vNeedCrisp = false;
}
function vBasisMatches() {
  if (!vBasis) return false;
  return Math.abs(vBasis.cx - cam.x) < 1e-3 && Math.abs(vBasis.cy - cam.y) < 1e-3 &&
    Math.abs(vBasis.cz - cam.z) / Math.max(1e-9, vBasis.cz) < 1e-4 &&
    Math.abs(vBasis.ox - usr.ox) < 0.5 && Math.abs(vBasis.oy - usr.oy) < 0.5 &&
    Math.abs(vBasis.oz - usr.z) / Math.max(1e-9, vBasis.oz) < 1e-4;
}
function vWarpAmount() {
  // how far the live camera has drifted from the crisp render — big drift = re-render
  if (!vBasis) return 1e9;
  const K0 = vBasis.cz * vBasis.oz, K1 = cam.z * usr.z;
  const s = K1 / Math.max(1e-12, K0);
  const dx = Math.abs(cam.x - vBasis.cx) * K1 + Math.abs(usr.ox - vBasis.ox);
  const dy = Math.abs(cam.y - vBasis.cy) * K1 + Math.abs(usr.oy - vBasis.oy);
  return Math.max(Math.abs(Math.log(Math.max(1e-9, s))), dx / 300, dy / 300);
}
function vWarpDraw() {
  // camera moved since the crisp render: warp the cached bitmap (one drawImage, 60fps)
  const K0 = vBasis.cz * vBasis.oz, K1 = cam.z * usr.z;
  const s = K1 / Math.max(1e-12, K0);
  const T0x = vw / 2 + vBasis.ox, T0y = vh / 2 + vBasis.oy;
  const T1x = vw / 2 + usr.ox, T1y = vh / 2 + usr.oy;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalCompositeOperation = "source-over";
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.translate(T1x - s * T0x + K1 * (vBasis.cx - cam.x), T1y - s * T0y + K1 * (vBasis.cy - cam.y));
  ctx.scale(s, s);
  ctx.drawImage(vlc, 0, 0, vw, vh);
}
function vBlit() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalCompositeOperation = "source-over";
  ctx.drawImage(vlc, 0, 0, vw, vh);
}
function vMotion() {
  // camera is moving — once it settles, re-render crisp if the warp drifted far.
  // Sierpinski settles sooner so finer triangles show up right after you stop.
  clearTimeout(vSettleT);
  const mode = cur;
  const wait = mode === "sierpinski" ? 150 : 300;
  const lim = mode === "sierpinski" ? 0.03 : 0.12;
  vSettleT = setTimeout(function () {
    if (cur !== mode) return;
    if (mode === "sierpinski" && PTRS.size > 0) { vMotion(); return; }
    if (vWarpAmount() > lim) vNeedCrisp = true;
  }, wait);
}
function vectorFrame() {
  let moving = false;
  if (!camLock) moving = cameraTick();
  if (moving) vMotion();
  // don't magnify the cached gasket more than ~4× — rebuild, then keep warping
  if (cur === "sierpinski" && vBasis && !vNeedCrisp && vWarpAmount() > 1.45) vNeedCrisp = true;
  if (vNeedCrisp || !vBasis) vRenderCrisp();
  if (!vBasis) return;
  // always present the cache this frame. the old crisp-only branch drew nothing
  // to the screen, so Sierpinski flashed the background on every zoom tick.
  if (!vBasisMatches()) vWarpDraw();
  else vBlit();
}
function cameraTick() {
  if (camLock) return false; // user took the camera — it stays exactly where they put it
  const cxp = (minX + maxX) / 2, cyp = (minY + maxY) / 2;
  const bbw = Math.max(1, maxX - minX), bbh = Math.max(1, maxY - minY);
  let tz = Math.min(vw / (bbw * 1.28), vh / (bbh * 1.28));
  // golden + fern may zoom in on the first stroke; everything else stays capped
  if (!tightCam()) tz = Math.min(tz, maxZ);
  const tx = cxp + introBias * (0.30 * vw / Math.max(tz, 1e-6));
  const dx = tx - cam.x, dy = cyp - cam.y, dz = tz - cam.z;
  const moved = Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5 || Math.abs(dz) > tz * 0.002;
  cam.x += dx * 0.09;
  cam.y += dy * 0.09;
  cam.z += dz * 0.07;
  return moved;
}
// user camera: pinch-zoom & drag-pan sit on top of the auto camera
let usr = { z: 1, ox: 0, oy: 0 };
function spawnFrame() {
  // box around the first stroke. camera starts here and only backs up once growth leaves it
  return { minX: -0.22, maxX: 1.28, minY: -0.55, maxY: 0.55 };
}
function camForBox(b) {
  const bbw = Math.max(0.2, b.maxX - b.minX), bbh = Math.max(0.2, b.maxY - b.minY);
  return {
    x: (b.minX + b.maxX) / 2,
    y: (b.minY + b.maxY) / 2,
    z: Math.min(vw / (bbw * 1.28), vh / (bbh * 1.28))
  };
}
function holdSpawnFrame() {
  const b = spawnFrame();
  vTouch(b.minX, b.minY);
  vTouch(b.maxX, b.maxY);
}
function tightCam() { return cur === "fern" || cur === "star" || cur === "vine"; }
function closeSpawnCam() {
  introBias = 0;
  camLock = false;
  cam = camForBox(spawnFrame());
}
function vecWheel(f, mx, my) {
  let af = f;
  if (cur === "sierpinski") {
    const nz = Math.min(1e9, Math.max(0.35, usr.z * f));
    af = nz / Math.max(1e-9, usr.z);
  }
  const Cx = vw / 2, Cy = vh / 2;
  usr.ox = mx - Cx - (mx - Cx - usr.ox) * af;
  usr.oy = my - Cy - (my - Cy - usr.oy) * af;
  usr.z *= af;
}

/* ================= BLOOM (the original infinite garden) ================= */
// every segment is stored (world coords) so the garden can be re-rendered
// razor-sharp at any zoom — no magnified bitmaps, ever
const BSEG_CAP = 650000;
let bstore = null, bsegN = 0;
function bloomStore(x1, y1, z1, x2, y2, z2, w, gen, t) {
  if (!bstore || bstore.length < BSEG_CAP * 9) bstore = new Float32Array(BSEG_CAP * 9);
  if (bsegN >= BSEG_CAP) return;
  const o = bsegN * 9;
  bstore[o] = x1; bstore[o + 1] = y1; bstore[o + 2] = z1;
  bstore[o + 3] = x2; bstore[o + 4] = y2; bstore[o + 5] = z2;
  bstore[o + 6] = w; bstore[o + 7] = gen; bstore[o + 8] = t;
  bsegN++;
}
function bloomRestroke() {
  const pal = PALETTES[palIdx];
  const z = Math.max(1e-6, cam.z * usr.z);
  vctx.lineCap = "butt";
  vctx.lineJoin = "bevel";
  const paths = [];
  for (let k = 0; k < bsegN; k++) {
    const o = k * 9, gen = bstore[o + 7] | 0, t = bstore[o + 8];
    const hue = ((pal.hues[gen % pal.hues.length] + t * 0.12 + gen * 17) % 360 + 360) % 360;
    const key = Math.min(15, gen) * 45 + Math.min(44, (hue / 8) | 0);
    let path = paths[key];
    if (!path) path = paths[key] = new Path2D();
    path.moveTo(bstore[o], bstore[o + 1]);
    path.lineTo(bstore[o + 3], bstore[o + 4]);
  }
  for (let key = 0; key < paths.length; key++) {
    if (!paths[key]) continue;
    const gen = (key / 45) | 0;
    const px = gen === 0 ? 1.2 : gen < 4 ? 0.95 : 0.75;
    vctx.lineWidth = px / z;
    vctx.strokeStyle = "hsla(" + ((key % 45) * 8) + "," + pal.sat + "%," + Math.min(74, 54 + gen * 2.2) + "%,0.9)";
    vctx.stroke(paths[key]);
  }
}
function bloomVecDraw() {
  const pal = PALETTES[palIdx];
  const z = Math.max(1e-6, cam.z * usr.z);
  vctx.fillStyle = "hsla(" + pal.hues[0] + "," + pal.sat + "%,78%,0.95)";
  vctx.beginPath();
  vctx.arc(START_X, 0, 1.6 / z, 0, TAU);
  vctx.fill();
  bloomRestroke();
}
function bloomNew() {
  seed = (Math.random() * 0xffffff) | 0;
  rng = mulberry32(seed);
  zrng = mulberry32((seed ^ 0x9e3779b9) >>> 0);
  P0 = {
    baseTurn:  (rng() - 0.5) * 0.24,
    waveAmp:   0.25 + rng() * 0.75,
    waveFreq:  0.015 + rng() * 0.075,
    jitter:    0.35 + rng() * 0.55,
    branchP:   0.025 + rng() * 0.075,
    branchAng: GOLDEN * (0.55 + rng() * 0.9),
    stepLen:   6.5 + rng() * 5,
    lenDecay:  0.962 + rng() * 0.025
  };
  // z wander uses its own stream so the 2D garden stays pixel-identical
  P0.pitchAmp = 0.35 + zrng() * 0.5;
  P0.pitchFreq = 0.02 + zrng() * 0.05;
  P0.pitchJitter = 0.3 + zrng() * 0.4;
  P0.lift = (zrng() - 0.35) * 0.9;
  palIdx = (rng() * PALETTES.length) | 0;
  turtles = [{ x: START_X, y: 0, a: (rng() - 0.5) * 0.6, gen: 0, t: 0, phase: rng() * TAU, alive: true }];
  turtles[0].z = 0;
  turtles[0].p = (zrng() - 0.5) * 0.3;
  turtles[0].pphase = zrng() * TAU;
  lastTip = { x: START_X, y: 0, a: 0, z: 0 };
  minX = maxX = START_X; minY = maxY = 0;
  bMinZ = bMaxZ = 0;
  segs = 0; taps = 0; introBias = 1; ripples = [];
  bsegN = 0;
  camLock = false;
  cam = { x: START_X, y: 0, z: maxZ };
  vNeedCrisp = true;
  b3d.lock = false;
  b3dNeed = true;
  if (b3d.on) b3dFit();
}
function bloomGrow(px, py) {
  if (bsegN >= BSEG_CAP) return;
  taps++;
  const kids = [];
  const pal = PALETTES[palIdx];
  vEnsure();
  vApplyCam(vctx);
  vctx.lineCap = "butt";
  vctx.lineJoin = "bevel";
  const zc = Math.max(1e-6, cam.z * usr.z);
  let aliveCount = 0;
  for (const tu of turtles) if (tu.alive) aliveCount++;
  for (const tu of turtles) {
    if (!tu.alive) continue;
    const steps = tu.gen < 3 ? 26 : tu.gen < 6 ? 14 : 7;
    const len = P0.stepLen * Math.pow(P0.lenDecay, tu.gen);
    const pxw = tu.gen === 0 ? 1.2 : tu.gen < 4 ? 0.95 : 0.75;
    for (let s = 0; s < steps; s++) {
      if (bsegN >= BSEG_CAP) { tu.alive = false; break; }
      tu.a += P0.baseTurn * (0.5 + rng())
            + P0.waveAmp * 0.35 * Math.sin(tu.t * P0.waveFreq + tu.phase)
            + (rng() - 0.5) * P0.jitter;
      tu.t++;
      const nx = tu.x + Math.cos(tu.a) * len;
      const ny = tu.y + Math.sin(tu.a) * len;
      tu.p += P0.pitchAmp * 0.3 * Math.sin(tu.t * P0.pitchFreq + tu.pphase) + (zrng() - 0.5) * P0.pitchJitter;
      tu.p = Math.max(-1.2, Math.min(1.2, tu.p));
      const nz = tu.z + (Math.sin(tu.p) + P0.lift * 0.15) * len;
      const w = pxw;
      const hue = (pal.hues[tu.gen % pal.hues.length] + tu.t * 0.12 + tu.gen * 17) % 360;
      if (!b3d.on) {
        vctx.strokeStyle = "hsla(" + hue.toFixed(1) + "," + pal.sat + "%," +
          Math.min(74, 54 + tu.gen * 2.2).toFixed(1) + "%,0.9)";
        vctx.lineWidth = pxw / zc;
        vctx.beginPath();
        vctx.moveTo(tu.x, tu.y);
        vctx.lineTo(nx, ny);
        vctx.stroke();
      }
      bloomStore(tu.x, tu.y, tu.z, nx, ny, nz, w, tu.gen, tu.t);
      tu.x = nx; tu.y = ny; tu.z = nz; segs++;
      vTouch3(nx, ny, nz);
      const bp = P0.branchP * (1 - tu.gen / MAXG);

    const paths = new Array(60);

function resize() {

function frame(now) {
  requestAnimationFrame(frame);
  const M = MODES[cur];
  if (M.pump) M.pump();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.drawImage(bg, 0, 0, vw, vh);
  M.draw(now);
  ripples = ripples.filter(r => now - r.t0 < 650);
  for (const r of ripples) {
    const age = (now - r.t0) / 650;
    ctx.strokeStyle = "rgba(255,255,255," + ((1 - age) * 0.45).toFixed(3) + ")";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + age * 90, 0, TAU); ctx.stroke();
  }
  if (holding && PTRS.size === 1 && holdArmed && M.holdTick && now - lastHold > 90) { lastHold = now; M.holdTick(); }
  const pn = document.getElementById("palname");
  if (palFlashT && now > palFlashT) { palFlashT = 0; pn.style.opacity = 0; }
  if (M.stats) {
    const s = M.stats();
    const el = document.getElementById("stats");
    if (el.textContent !== s) el.textContent = s;

    m0x: (p[0].x + p[1].x) / 2, m0y: (p[0].y + p[1].y) / 2,

    m3d.ty = pinchSt.m3dTy - (m1y - pinchSt.m0y) * inv;

  }
  if (M.isEscape) {
    const z = cFromCss(pinchSt.m0x, pinchSt.m0y, pinchSt.v0);
    const nV = viewForAnchor(z, m1x, m1y, escLimitSize(pinchSt.v0.size / f));
    pinchSt.nV = nV;
    M.gestPreview(nV);
    escFollow();
  } else {
    const u0 = pinchSt.u0, Cx = vw / 2, Cy = vh / 2;
    let af = f;
    if (cur === "sierpinski") {
      const nz = Math.min(1e9, Math.max(0.35, u0.z * f));
      af = nz / Math.max(1e-9, u0.z);
      usr.z = nz;
    } else usr.z = u0.z * f;
    usr.ox = m1x - Cx - (pinchSt.m0x - Cx - u0.ox) * af;
    usr.oy = m1y - Cy - (pinchSt.m0y - Cy - u0.oy) * af;
    camLock = true; vMotion();
  }
}
function movePan(x, y) {
  if (cur === "bloom" && b3d.on) {
    b3d.yaw += (x - downInfo.lx) * 0.008;
    b3d.pitch = clamp(b3d.pitch + (y - downInfo.ly) * 0.008, -1.4, 1.4);
    b3d.lock = true;
    b3dMotion();
    return;
  }
  if (cur === "menger" && m3d.on) {
    m3d.yaw += (x - downInfo.lx) * 0.0075;
    m3d.pitch = clamp(m3d.pitch + (y - downInfo.ly) * 0.0065, -1.2, 1.2);
    m3dTouch();
    return;
  }
  const M = MODES[cur];
  if (!panSt) {
    panSt = { x0: downInfo.x, y0: downInfo.y, v0: M.isEscape ? escViewOf(M) : null, nV: null };
  }
  if (M.isEscape) {
    const z = cFromCss(panSt.x0, panSt.y0, panSt.v0);
    const nV = viewForAnchor(z, x, y, panSt.v0.size);
    panSt.nV = nV;
    M.gestPreview(nV);
    escFollow();
  } else {
    usr.ox += x - downInfo.lx;
    usr.oy += y - downInfo.ly;
    camLock = true; vMotion(); // user took the camera — freeze the auto follow
  }
}
function commitGest() {
  const M = MODES[cur];
  if (M.isEscape) {
    const nV = (pinchSt && pinchSt.nV) || (panSt && panSt.nV);
    if (nV) M.gestCommit(nV);
  }
}
stage.addEventListener("pointerdown", function (e) {
  PTRS.set(e.pointerId, { x: e.clientX, y: e.clientY });
  holding = true;
  if (PTRS.size === 1) {
    downInfo = { x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, moved: false };
    holdArmed = true; lastHold = performance.now();
  } else if (PTRS.size === 2) {
    holdArmed = false;
    panSt = null;
    startPinch();
  }
  e.preventDefault();
});
stage.addEventListener("pointermove", function (e) {
  if (!PTRS.has(e.pointerId)) return;
  PTRS.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (PTRS.size === 2 && pinchSt) { movePinch(); return; }
  if (PTRS.size === 1 && downInfo) {
    const dx = e.clientX - downInfo.x, dy = e.clientY - downInfo.y;
    if (!downInfo.moved && Math.hypot(dx, dy) > 10) { downInfo.moved = true; holdArmed = false; }
    if (downInfo.moved) movePan(e.clientX, e.clientY);
    downInfo.lx = e.clientX; downInfo.ly = e.clientY;
  }
});
function endPointer(e) {
  PTRS.delete(e.pointerId);
  const M = MODES[cur];
  if (PTRS.size === 0) {
    commitGest();
    if (downInfo && !downInfo.moved && holdArmed) M.tap(downInfo.x, downInfo.y);
    downInfo = null; pinchSt = null; panSt = null; holdArmed = false; holding = false;
  } else if (PTRS.size === 1) {
    // pinch collapsed to one finger: commit, no accidental tap after
    commitGest();
    pinchSt = null; panSt = null;
    const p = [...PTRS.values()][0];
    downInfo = { x: p.x, y: p.y, lx: p.x, ly: p.y, moved: true };
    holdArmed = false;
  }
}
stage.addEventListener("pointerup", endPointer);
stage.addEventListener("pointercancel", endPointer);
stage.addEventListener("wheel", function (e) {
  e.preventDefault();
  const M = MODES[cur];
  let dy = e.deltaY;
  if (e.deltaMode === 1) dy *= 16;
  else if (e.deltaMode === 2) dy *= vh;
  const f = Math.exp(-dy * 0.00115);
  if (cur === "bloom" && b3d.on) {
    b3d.dist = clamp(b3d.dist / f, 50, 20000);
    b3d.lock = true;
    b3dMotion();
    return;
  }
  if (cur === "menger" && m3d.on) { m3dScale(f); return; }
  if (M.isEscape) {
    const V = { cx: M.cx, cy: M.cy, size: M.size };
    const z = cFromCss(e.clientX, e.clientY, V);
    const nV = viewForAnchor(z, e.clientX, e.clientY, escLimitSize(V.size / f));
    M.cx = nV.cx; M.cy = nV.cy; M.size = nV.size;
    escFollow();
    clearTimeout(wheelT);
    wheelT = setTimeout(function () {
      const C = MODES[cur];
      if (!C || !C.isEscape || PTRS.size > 0) return;
      if (C.dive && C.zoom() >= ESC_LIMIT) C.rebirth();
      scheduleFine();
    }, 160);
    return;
  }
  if (M.wheelVec) {
    M.wheelVec(f, e.clientX, e.clientY);
    camLock = true; vMotion();
  }
}, { passive: false });
window.addEventListener("contextmenu", function (e) { e.preventDefault(); });
document.addEventListener("gesturestart", function (e) { e.preventDefault(); });

document.getElementById("btnNew").addEventListener("click", function (e) {
  e.stopPropagation(); MODES[cur].reset(); updateStats(); flashPalette();
});
document.getElementById("btnFit").addEventListener("click", function (e) {
  e.stopPropagation(); fitView();
});
document.getElementById("btn3D").addEventListener("click", function (e) {
  e.stopPropagation();
  if (cur === "bloom") {
    b3d.on = !b3d.on;
    if (b3d.on) b3dFit();
    else { vNeedCrisp = true; vBasis = null; }
  } else if (cur === "menger") {
    m3d.on = !m3d.on;
    if (m3d.on) m3dFit();
    else vNeedCrisp = true;
  } else return;
  this.classList.toggle("on", (cur === "bloom" && b3d.on) || (cur === "menger" && m3d.on));
  updateStats();
});
// ⛶ Fit: reframe the whole fractal on screen WITHOUT touching growth —
// unlike ✦ New it never resets iterations, re-rolls seeds, or changes Julia's constant
function fitView() {
  const M = MODES[cur];
  if (cur === "bloom" && b3d.on) { b3dFit(); updateStats(); return; }
  if (cur === "menger" && m3d.on) { m3dFit(); updateStats(); return; }
  if (M.isEscape) {
    if (cur === "mandelbrot") { M.cx = -0.5; M.cy = 0; } else { M.cx = 0; M.cy = 0; }
    M.size = 3.4; VG = null; escStart(M.job());
  } else if (cur === "sierpinski") {
    sierHome();
  } else {
    introBias = 0; camLock = false;
    usr = { z: 1, ox: 0, oy: 0 }; vNeedCrisp = true;
    if (tightCam() && maxX > minX && minX < 1e8) cam = camForBox({ minX: minX, maxX: maxX, minY: minY, maxY: maxY });
    else if (tightCam()) cam = camForBox(spawnFrame());
    else cam = { x: 0, y: 0, z: maxZ };
  }
  updateStats();
}
document.getElementById("btnRoots").addEventListener("click", function (e) {
  e.stopPropagation();
  if (cur === "tree") { MODES.tree.rootTap(); updateStats(); }
});
document.getElementById("btnPal").addEventListener("click", function (e) {
  e.stopPropagation();
  palIdx = (palIdx + 1) % PALETTES.length;
  MODES[cur].onPalette();
  flashPalette(); updateStats();
});
document.getElementById("btnSave").addEventListener("click", function (e) {
  e.stopPropagation();
  stage.toBlob(function (blob) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "fractal-" + cur + "-" + Date.now().toString(36) + ".png";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
  });
});
window.addEventListener("keydown", function (e) {
  if (e.code === "Space") { e.preventDefault(); MODES[cur].tap(vw / 2, vh / 2); }
  else if (e.key === "n" || e.key === "N") MODES[cur].reset();
  else if (e.key === "r" || e.key === "R") document.getElementById("btnRoots").click();
  else if (e.key === "c" || e.key === "C") document.getElementById("btnPal").click();
  else if (e.key === "z" || e.key === "Z") keyZoom(1.4);       // keyboard zoom in (desktop)
  else if (e.key === "x" || e.key === "X") keyZoom(1 / 1.4);  // keyboard zoom out (desktop)
  else if (e.key === "f" || e.key === "F") fitView();         // fit whole fractal on screen
  else if (cur === "bloom" && b3d.on && e.key === "ArrowLeft") { e.preventDefault(); b3d.yaw -= 0.08; b3d.lock = true; b3dMotion(); }
  else if (cur === "bloom" && b3d.on && e.key === "ArrowRight") { e.preventDefault(); b3d.yaw += 0.08; b3d.lock = true; b3dMotion(); }
  else if (cur === "bloom" && b3d.on && e.key === "ArrowUp") { e.preventDefault(); b3d.pitch = clamp(b3d.pitch - 0.06, -1.4, 1.4); b3d.lock = true; b3dMotion(); }
  else if (cur === "bloom" && b3d.on && e.key === "ArrowDown") { e.preventDefault(); b3d.pitch = clamp(b3d.pitch + 0.06, -1.4, 1.4); b3d.lock = true; b3dMotion(); }
  else if (cur === "menger" && m3d.on && e.key === "ArrowLeft") { e.preventDefault(); m3d.yaw -= 0.06; m3dTouch(); }
  else if (cur === "menger" && m3d.on && e.key === "ArrowRight") { e.preventDefault(); m3d.yaw += 0.06; m3dTouch(); }
  else if (cur === "menger" && m3d.on && e.key === "ArrowUp") { e.preventDefault(); m3d.pitch = clamp(m3d.pitch - 0.05, -1.2, 1.2); m3dTouch(); }
  else if (cur === "menger" && m3d.on && e.key === "ArrowDown") { e.preventDefault(); m3d.pitch = clamp(m3d.pitch + 0.05, -1.2, 1.2); m3dTouch(); }
  else if (e.key >= "1" && e.key <= "9") setMode(ORDER[+e.key - 1]);
});

// keyboard zoom — same code path as the wheel, anchored at screen center
function keyZoom(f) {
  if (cur === "bloom" && b3d.on) {
    b3d.dist = clamp(b3d.dist / f, 50, 20000);
    b3d.lock = true;
    b3dMotion();
    return;
  }
  if (cur === "menger" && m3d.on) { m3dScale(f); return; }
  const M = MODES[cur], mx = vw / 2, my = vh / 2;
  if (M.isEscape) {
    const V = { cx: M.cx, cy: M.cy, size: M.size };
    const z = cFromCss(mx, my, V);
    const nV = viewForAnchor(z, mx, my, escLimitSize(V.size / f));
    M.cx = nV.cx; M.cy = nV.cy; M.size = nV.size;
    escFollow();
    clearTimeout(wheelT);
    wheelT = setTimeout(function () {
      const C = MODES[cur];
      if (!C || !C.isEscape || PTRS.size > 0) return;
      if (C.dive && C.zoom() >= ESC_LIMIT) C.rebirth();
      scheduleFine();
    }, 160);
    return;
  }
  if (M.wheelVec) {
    M.wheelVec(f, mx, my);
    camLock = true; vMotion();
  }
}

// ---- go ----
seed = (Math.random() * 0xffffff) | 0;
rng = mulberry32(seed);
palIdx = 0;
resize();
buildModeBar();
setMode("bloom");
requestAnimationFrame(frame);
</script>
