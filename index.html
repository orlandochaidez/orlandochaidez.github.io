  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:-webkit-fill-available;}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;
    display:flex;align-items:center;justify-content:center;padding:24px;
    min-height:100vh;min-height:-webkit-fill-available;min-height:100dvh;
    background:#000 var(--gal) 42% 45%/112vmax 112vmax no-repeat;animation:drift 70s ease-in-out infinite alternate;}
  a.enter{display:block;position:relative;z-index:2;line-height:0;transition:transform .45s ease;cursor:pointer}
  a.enter:hover,a.enter:focus-visible{transform:scale(1.03) rotate(-.4deg);outline:none}
  a.enter:active{transform:scale(.985)}
  .float{position:relative;display:block;animation:hover 7s ease-in-out infinite}
  img.monkey{width:min(560px,92vw);height:auto;display:block;filter:drop-shadow(0 22px 44px rgba(0,0,0,.6))}
  @keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @keyframes drift{from{background-position:42% 45%}to{background-position:58% 55%}}
  @media (prefers-reduced-motion:reduce){.float{animation:none}body{animation:none}}
  .eye{position:absolute;width:4.6%;aspect-ratio:1;background:#fff;border-radius:50%;z-index:2;pointer-events:none;
    transform:translate(-50%,-50%);box-shadow:inset 0 0 0 2px rgba(0,0,0,.18),0 1px 4px rgba(0,0,0,.4)}
  .eye.e2{width:3.9%}
  .eye .pupil{position:absolute;left:50%;top:50%;width:47%;aspect-ratio:1;background:#111;border-radius:50%;
    transform:translate(-50%,-50%)}

  body.map a.enter{transform:translateY(-16vh) scale(.76);pointer-events:none}#map{position:fixed;inset:0;z-index:1;opacity:0;pointer-events:none;transition:opacity .45s;background:#000}body.map #map{opacity:1;pointer-events:auto}#mapimg{position:absolute;left:50%;top:50%;width:min(100vw,104.28vh);aspect-ratio:1024/982;transform:translate(-50%,-50%);background-image:var(--gal);background-size:100% 100%}.mk{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:1.5px solid rgba(255,255,255,.85);background:rgba(255,255,255,.12);color:#fff;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;animation:pulse 2.2s ease-out infinite;padding:0}.mk.real{border-color:#ffd76a;background:rgba(255,190,60,.16);color:#ffd76a}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}70%{box-shadow:0 0 0 12px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}#hint{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:4;color:rgba(255,255,255,.8);font-size:11px;letter-spacing:2px;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}body.map #hint{opacity:1}#card{position:fixed;left:50%;bottom:16px;transform:translate(-50%,24px);width:min(430px,92vw);z-index:5;background:rgba(9,11,22,.9);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:16px 18px;color:#eef;opacity:0;pointer-events:none;transition:.35s}#card.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}#ctag{font-size:10px;letter-spacing:2px;color:#ffd76a}#ctag.fun{color:#8fd8ff}#card h2{margin:3px 0 6px;font-size:20px}#card p{margin:0 0 12px;font-size:14px;line-height:1.45;color:#ccd}#cl{display:inline-block;background:#fff;color:#000;padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;text-decoration:none}#cx{position:absolute;top:6px;right:10px;background:none;border:0;color:#99a;font-size:15px;cursor:pointer;padding:4px}  .fallback{display:none;width:min(520px,88vw);aspect-ratio:1;border-radius:22px;border:3px dashed rgba(255,255,255,.35);
    align-items:center;justify-content:center;font-size:150px;background:#1b2030;line-height:1}
</style>

<script>
(() => {
  const eyes = [...document.querySelectorAll('.eye')];
  if(!eyes.length) return;
  const pupils = eyes.map(e => e.querySelector('.pupil'));
  let tx = innerWidth/2, ty = innerHeight/3, cx = tx, cy = ty;
  addEventListener('pointermove', e => { tx = e.clientX; ty = e.clientY; }, {passive:true});
  (function loop(){
    cx += (tx-cx)*.16; cy += (ty-cy)*.16;
    eyes.forEach((eye, i) => {
      const r = eye.getBoundingClientRect();
      const ex = r.left + r.width/2, ey = r.top + r.height/2;
      const dx = cx-ex, dy = cy-ey;
      const d = Math.hypot(dx,dy) || 1;
      const max = r.width*.27, m = Math.min(d, 70)/70*max;
      pupils[i].style.transform = 'translate(calc(-50% + '+(dx/d*m)+'px), calc(-50% + '+(dy/d*m)+'px))';
    });
    requestAnimationFrame(loop);
  })();
})();
</script>
