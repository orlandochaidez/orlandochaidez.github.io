<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>space monkey</title>
<meta name="description" content="space monkey">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0f1115;color:#fff;
    display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(900px 500px at 50% 20%, #24304a 0%, #0f1115 62%);}
  a.enter{display:block;line-height:0;border-radius:22px;transition:transform .15s ease, box-shadow .15s ease;cursor:pointer}
  a.enter:hover,a.enter:focus-visible{transform:scale(1.03) rotate(-.4deg);box-shadow:0 18px 50px rgba(0,0,0,.55);outline:none}
  a.enter:active{transform:scale(.985)}
  img.monkey{width:min(520px,88vw);height:auto;border-radius:22px;border:3px solid rgba(255,255,255,.22);display:block;background:#1b2030}
  .fallback{display:none;width:min(520px,88vw);aspect-ratio:1;border-radius:22px;border:3px dashed rgba(255,255,255,.35);
    align-items:center;justify-content:center;font-size:150px;background:#1b2030;line-height:1}
</style>
</head>
<body>
  <a class="enter" href="directory/" aria-label="Space monkey">
    <img class="monkey" id="monkeyImg" src="monkey.webp" alt="Space monkey">
    <span class="fallback" id="monkeyFallback" aria-hidden="true">🐵</span>
  </a>

<script>
(() => {
  // If monkey.png isn't the real filename, try a few common names before showing the emoji placeholder.
  const img=document.getElementById('monkeyImg'), fb=document.getElementById('monkeyFallback');
  const tries=['monkey.webp','monkey.png','monkey.jpg','monkey.jpeg','Monkey.png','Monkey.jpg','monkey-pic.png','monkeypic.png','monkey.PNG'];
  let i=0;
  img.addEventListener('error', () => {
    i++;
    if(i<tries.length){ img.src=tries[i]; }
    else { img.style.display='none'; fb.style.display='flex'; }
  });
  // If the current src already failed before this listener attached, re-kick it.
  if(img.complete && img.naturalWidth===0 && img.src) { const s=img.src; img.src=''; img.src=s; }
})();
</script>
</body>
</html>
