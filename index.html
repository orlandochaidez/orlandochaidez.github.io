<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Click the monkey to enter 🐵</title>
<meta name="description" content="Click the monkey to enter the arcade.">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0f1115;color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;
    background:radial-gradient(900px 500px at 50% 20%, #24304a 0%, #0f1115 62%);}
  h1{margin:0;font-size:clamp(26px,5vw,42px);letter-spacing:.3px}
  p{margin:0;color:#9aa3b2}
  a.enter{display:block;line-height:0;border-radius:22px;transition:transform .15s ease, box-shadow .15s ease}
  a.enter:hover,a.enter:focus-visible{transform:scale(1.03) rotate(-.4deg);box-shadow:0 18px 50px rgba(0,0,0,.55);outline:none}
  a.enter:active{transform:scale(.985)}
  img.monkey{width:min(420px,82vw);height:auto;border-radius:22px;border:3px solid rgba(255,255,255,.22);display:block;background:#1b2030}
  .fallback{display:none;width:min(420px,82vw);aspect-ratio:1;border-radius:22px;border:3px dashed rgba(255,255,255,.35);
    align-items:center;justify-content:center;font-size:150px;background:#1b2030;line-height:1}
  .cta{font-weight:900;font-size:19px;background:#ffcc00;color:#221a00;padding:13px 24px;border-radius:999px;text-decoration:none}
  .note{font-size:12px;color:#66707f;max-width:520px;line-height:1.5}
</style>
</head>
<body>
  <h1>🐵 Click the monkey to enter</h1>

  <!-- Clicking the monkey now takes you to the arcade menu (arcade/) instead of straight into Flappy. -->
  <a class="enter" href="arcade/" aria-label="Enter the arcade">
    <img class="monkey" id="monkeyImg" src="monkey.png" alt="Monkey — click to enter the arcade">
    <span class="fallback" id="monkeyFallback" aria-hidden="true">🐵</span>
  </a>

  <a class="cta" href="arcade/">Enter the Arcade →</a>
  <p>Flappy, OG Blaster, Lemonade Stand, Pong, Snake, Brick Breaker &amp; more.</p>

  <p class="note">
    big 🐵
  </p>

<script>
(() => {
  // If monkey.png isn't the real filename, try a few common names before showing the emoji placeholder.
  const img=document.getElementById('monkeyImg'), fb=document.getElementById('monkeyFallback');
  const tries=['monkey.png','monkey.jpg','monkey.jpeg','monkey.webp','Monkey.png','Monkey.jpg','monkey-pic.png','monkeypic.png','monkey.PNG'];
  let i=0;
  img.addEventListener('error', () => {
    i++;
    if(i<tries.length){ img.src=tries[i]; }
    else { img.style.display='none'; fb.style.display='flex'; }
  });
  // If the current src already failed before this listener attached, re-kick it.
  if(img.complete && img.naturalWidth===0 && img.src) { const s=img.src; img.src=''; img.src=s; }
})();
</script>
</body>
</html>
