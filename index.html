<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Site</title>
  <style>
    /* Full page flex container to center the image */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;          /* full screen height */
      margin: 0;
      background-color: #fff; /* change if you want a different background */
    }

    img {
      max-width: 80%;         /* scales down on smaller screens */
      height: auto;
    }
  </style>
</head>
<body>
  <!-- Your image -->
  <img src="monkeyapple.png" alt="Logo">
</body>
</html>
