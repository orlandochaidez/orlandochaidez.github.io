    * { margin: 0; padding: 0; box-sizing: border-box; }

    #cam { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }

    #status { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 12px 20px; border-radius: 20px; text-align: center; max-width: 92vw; z-index: 10; }
    button { background: #4a9eff; color: white; border: none; padding: 10px 16px; border-radius: 6px; margin: 4px; cursor: pointer; }
    button:disabled { opacity: .5; }
    #msg { margin-top: 6px; font-size: 13px; color: #ffd479; }
  </style>
</head>

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function getLST(lon) {
      const now = new Date();
      const jd = now.getTime() / 86400000 + 2440587.5;
      const d = jd - 2451545.0;
      let gmst = 18.697374558 + 24.06570982441908 * d;
      gmst = ((gmst % 24) + 24) % 24;
      let lst = gmst + lon / 15;
      return ((lst % 24) + 24) % 24;
    }

    function raDecToAltAz(ra, dec, lat, lon) {
      const lst = getLST(lon);
      const ha = (lst - ra) * 15 * Math.PI / 180;
      const decRad = dec * Math.PI / 180;
      const latRad = lat * Math.PI / 180;
      const sinAlt = Math.sin(decRad) * Math.sin(latRad) + Math.cos(decRad) * Math.cos(latRad) * Math.cos(ha);
      const alt = Math.asin(Math.max(-1, Math.min(1, sinAlt))) * 180 / Math.PI;
      const cosAlt = Math.cos(Math.asin(Math.max(-1, Math.min(1, sinAlt))));
      const cosAz = (Math.sin(decRad) - Math.sin(latRad) * sinAlt) / Math.max(1e-9, Math.cos(latRad) * cosAlt);
      let az = Math.acos(Math.max(-1, Math.min(1, cosAz))) * 180 / Math.PI;
      if (Math.sin(ha) > 0) az = 360 - az;
      return { alt, az };
    }

    function project(alt, az, heading, pitch, w, h) {
      const fov = 60;
      const relAz = (az - heading + 360) % 360;
      const relAzNorm = relAz > 180 ? relAz - 360 : relAz;
      const relAlt = alt - pitch;
      const x = w / 2 + (relAzNorm / (fov / 2)) * (w / 2);
      const y = h / 2 - (relAlt / (fov / 2)) * (h / 2);
      return { x, y, visible: Math.abs(relAzNorm) < fov && Math.abs(relAlt) < fov };
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (camOn) {
        // dim the live camera feed slightly so stars pop against it
        ctx.fillStyle = 'rgba(2,2,14,0.35)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
      if (lat === null) return;

      for (const s of STARS) {
        const { alt, az } = raDecToAltAz(s[0], s[1], lat, lon);
        const p = project(alt, az, heading, pitch, canvas.width, canvas.height);
        if (!p.visible) continue;
        const below = alt < 0; // under your feet — dimmed, but still there
        const size = Math.max(1.5, 6 - s[2] * 1.2);
        ctx.globalAlpha = below ? 0.35 : 1;
        // dark halo so the dot reads over bright video
        ctx.beginPath();
        ctx.arc(p.x, p.y, size + 3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
        if (s[3]) {
          ctx.font = '12px sans-serif';
          ctx.lineWidth = 3;
          ctx.strokeStyle = 'rgba(0,0,0,0.7)';
          ctx.strokeText(s[3], p.x + 8, p.y);
          ctx.fillStyle = '#fff';
          ctx.fillText(s[3], p.x + 8, p.y);
        }
        ctx.globalAlpha = 1;
      }

      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath();
      ctx.moveTo(canvas.width/2 - 20, canvas.height/2);
      ctx.lineTo(canvas.width/2 + 20, canvas.height/2);
      ctx.moveTo(canvas.width/2, canvas.height/2 - 20);
      ctx.lineTo(canvas.width/2, canvas.height/2 + 20);
      ctx.stroke();

      requestAnimationFrame(draw);
    }

    function getPosition(ms) {
      // geolocation with a hard timeout — never hangs silently
      return new Promise((res, rej) => {
        if (!navigator.geolocation) { rej(new Error('this browser has no geolocation')); return; }
        const t = setTimeout(() => rej(new Error('timed out — try outdoors, or check location settings')), ms);
        navigator.geolocation.getCurrentPosition(
          p => { clearTimeout(t); res(p); },
          e => { clearTimeout(t); rej(e); },
          { timeout: ms, maximumAge: 60000 }
        );
      });
    }

    function locErrorText(e) {
      if (!e) return 'unknown error';
      if (e.code === 1) return 'location permission denied — allow it for this site in Settings, then reload';
      if (e.code === 2) return 'location unavailable — try moving near a window or outdoors';
      if (e.code === 3) return 'location timed out — try again outdoors';
      return e.message || 'unknown error';
    }

    function attachOrientation() {
      window.addEventListener('deviceorientation', (e) => {
        if (e.webkitCompassHeading !== undefined) {
          heading = e.webkitCompassHeading;
        } else if (e.alpha !== null && e.alpha !== undefined) {
          heading = 360 - e.alpha;
        }
        if (e.beta !== null && e.beta !== undefined) {
          // beta reads 90° when the phone is upright, 0° when flat —
          // the rear camera points at altitude (beta − 90°)
          pitch = e.beta - 90;
        }
        headingEl.textContent = Math.round(heading);
        pitchEl.textContent = Math.round(pitch);
      });
    }

    startBtn.onclick = () => {
      startBtn.disabled = true;
      boot();
    };

    async function startCamera() {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return false;
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }, audio: false
        });
        video.srcObject = stream;
        await video.play();
        return true;
      } catch (e) { return false; }
    }

    async function boot() {
      // 1) motion permission FIRST, synchronously in the tap — iOS Safari
      //    refuses it if we ask after awaiting anything else.
      let motionOK = false;
      try {
        if (typeof DeviceOrientationEvent !== 'undefined' &&
            typeof DeviceOrientationEvent.requestPermission === 'function') {
          msgEl.textContent = 'Tap "Allow" for motion & orientation…';
          const perm = await DeviceOrientationEvent.requestPermission();
          motionOK = (perm === 'granted');
        } else {
          motionOK = true; // Android/desktop: no prompt needed
        }
      } catch (e) { motionOK = false; }
      if (motionOK) attachOrientation();

      // 2) rear camera for true AR — stars overlay the live sky
      msgEl.textContent = 'Starting camera… (allow when asked)';
      camOn = await startCamera();

      // 3) location, with a timeout so it can never hang silently
      msgEl.textContent = 'Getting your location… (allow when asked)';
      try {
        const pos = await getPosition(12000);
        lat = pos.coords.latitude;
        lon = pos.coords.longitude;
        latEl.textContent = lat.toFixed(4);
        lonEl.textContent = lon.toFixed(4);
      } catch (err) {
        msgEl.textContent = 'No location: ' + locErrorText(err);
        startBtn.disabled = false;
        return;
      }

      msgEl.textContent = motionOK
        ? (camOn ? 'Point your phone at the sky' : 'Point your phone at the sky (camera blocked — map mode)')
        : (camOn ? 'Point your phone at the sky (compass blocked — fixed view)' : 'Sky map mode (camera + compass blocked)');
      startBtn.style.display = 'none';
      document.getElementById('starCount').textContent = STARS.length;
      draw();
    }
  </script>
