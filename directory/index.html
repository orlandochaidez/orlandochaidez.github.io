<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>welcome</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{background:#6c5eb5;min-height:100%}
  body{
    font-family:"Courier New",Courier,monospace;
    background:#6c5eb5;
    color:#6c5eb5;
    padding:4vmin;
    min-height:100vh;min-height:-webkit-fill-available;min-height:100dvh;
    display:flex;
    -webkit-text-size-adjust:100%;
  }
  .screen{
    background:#352879;
    flex:1;
    max-width:960px;
    margin:0 auto;
    padding:30px 26px 64px;
    text-transform:uppercase;
    line-height:1.9;
    font-size:clamp(15px,2.4vw,19px);
    letter-spacing:1px;
  }
  .center{text-align:center}
  .head{margin:0 0 2px}
  .cursor{display:inline-block;width:.62em;height:1.05em;background:#6c5eb5;vertical-align:-.16em;margin-left:.1em;
    animation:blink 1.05s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .folder{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
    padding:8px 10px;margin-left:-10px;border-radius:2px;outline:none}
  .folder:hover,.folder:focus{background:#6c5eb5;color:#352879}
  .toggle{margin-left:1ch}
  .indent{padding-left:3ch}
  .item{display:block;padding:9px 10px;margin-left:-10px;color:#6c5eb5;text-decoration:none;cursor:pointer;
    -webkit-tap-highlight-color:transparent;border-radius:2px}
  .item:hover,.item:focus{background:#6c5eb5;color:#352879}
  .item.big{font-size:1.6em}
  .hidden{display:none}
  .foot{margin-top:40px;font-size:.85em}
  .hid{color:inherit;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .easter{color:#6c5eb5;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
  a{color:#6c5eb5}
</style>
</head>
<body>
<div class="screen">

<div class="center head">****&nbsp;&nbsp;Orlando&nbsp;&nbsp;****</div>
<div class="center" id="sysdate">System date</div>
<br>
<div>Ready.</div>
<br>

<div class="folder" id="f-arcade" role="button" tabindex="0" aria-expanded="false">
  [DIR] arcade<span class="toggle" id="t-arcade">[+]</span>
</div>
<div id="arcade" class="indent hidden">
  <a class="item" href="/arcade/lemonade-stand/index.html">Lemonade Stand</a>
  <a class="item" href="/arcade/pong/index.html">Pong</a>
  <a class="item" href="/arcade/snake/index.html">Snake</a>
  <a class="item" href="/arcade/brick-breaker/index.html">Brick Breaker</a>
  <a class="item" href="/arcade/blocky-blaster/index.html">Blocky Blaster (Doom)</a>
  <a class="item" href="/arcade/flappy/index.html">Flappy (Bird)</a>
  <a class="item" href="/arcade/pizza-pac/index.html">Pizza Pac (Pac-Man)</a>
  <a class="item" href="/arcade/block-drop/index.html">Block Drop (Tetris)</a>
</div>
<br>

<div class="folder" id="f-ram" role="button" tabindex="0" aria-expanded="false">
  [DIR] download more RAM<span class="toggle" id="t-ram">[+]</span>
</div>
<div id="ram" class="indent hidden">
  <div class="folder" id="f-ram500" role="button" tabindex="0" aria-expanded="false">
    [DIR] 500gb<span class="toggle" id="t-ram500">[+]</span>
  </div>
  <div id="ram500" class="indent hidden">
    <a class="item big" href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" aria-label="free RAM">&#128015;</a>
  </div>
  <div class="folder" id="f-ram1t" role="button" tabindex="0" aria-expanded="false">
    [DIR] 1tb<span class="toggle" id="t-ram1t">[+]</span>
  </div>
  <div id="ram1t" class="indent hidden">
    <a class="item big" href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" aria-label="free RAM">&#128015;</a>
  </div>
</div>
<br>

<div class="folder" id="f-side" role="button" tabindex="0" aria-expanded="false">
  [DIR] side quests<span class="toggle" id="t-side">[+]</span>
</div>
<div id="side" class="indent hidden">
  <a class="item" href="https://orlandochaidez.com/fred/">FRED</a>
  <a class="item" href="https://orlandochaidez.com/muscle-anatomy-3d/">Muscle Anatomy 3D</a>
</div>

<div class="foot"><a class="hid" href="https://coffeehotbox.com" aria-label="Coffee Hotbox">C:</a>\<a class="hid" href="https://odcpartners.com" aria-label="ODC Partners land biz">ORLANDO&gt;</a> <span id="typed"></span><span class="cursor"></span></div>

</div>
<script>
  // live system date, C64 style: FRIDAY OCTOBER 16TH 2026
  (function(){
    var days = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
    var months = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
    var d = new Date();
    var n = d.getDate();
    var suf = 'TH';
    if(n % 10 === 1 && n % 100 !== 11) suf = 'ST';
    else if(n % 10 === 2 && n % 100 !== 12) suf = 'ND';
    else if(n % 10 === 3 && n % 100 !== 13) suf = 'RD';
    document.getElementById('sysdate').textContent =
      'SYSTEM DATE   ' + days[d.getDay()] + ' ' + months[d.getMonth()] + ' ' + n + suf + ' ' + d.getFullYear();
  })();

  function toggle(id, folderEl, ev){
    if(ev){ ev.stopPropagation(); }
    var el = document.getElementById(id);
    var nowHidden = el.classList.toggle('hidden');
    document.getElementById('t-' + id).textContent = nowHidden ? '[+]' : '[\u2013]';
    if(folderEl){ folderEl.setAttribute('aria-expanded', String(!nowHidden)); }
  }
  function wire(folderId, panelId){
    var f = document.getElementById(folderId);
    f.addEventListener('click', function(ev){ toggle(panelId, f, ev); });
    f.addEventListener('keydown', function(ev){
      if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); toggle(panelId, f, ev); }
    });
  }
  wire('f-arcade', 'arcade');
  wire('f-ram', 'ram');
  wire('f-ram500', 'ram500');
  wire('f-ram1t', 'ram1t');
  wire('f-side', 'side');

  // little boot text typing effect, purely cosmetic
  var msg = 'LOADING COMPLETE. PICK A FOLDER.';
  var i = 0, out = document.getElementById('typed');
  (function type(){
    if(i < msg.length){ out.textContent = msg.slice(0, i++); setTimeout(type, 28); }
    else{
      out.innerHTML = 'LOADING COMPLETE. PICK A FOLDER' +
        '<a class="easter" href="/arcade/brand-theft-auto/index.html" aria-label="secret">&period;</a>';
    }
  })();
</script>
</body>
</html>
